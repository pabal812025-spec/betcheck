plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matchia.ia5d'
    compileSdk 35

    defaultConfig {
        // Paquete nuevo para instalar sin borrar la versión anterior ni chocar con su firma.
        applicationId 'com.matchia.ia5d.preview4'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.4.0-prueba'
    }

    signingConfigs {
        debug {
            storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
