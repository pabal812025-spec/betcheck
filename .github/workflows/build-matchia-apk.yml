name: Construir APK MatchIA

on:
  workflow_dispatch:
  push:
    paths:
      - "instalacion/**"
      - ".github/workflows/build-matchia-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas y herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK de prueba
        working-directory: instalacion/android
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MatchIA-APK-debug
          path: instalacion/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
