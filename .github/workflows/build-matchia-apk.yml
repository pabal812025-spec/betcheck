name: Construir APK MatchIA

on:
  workflow_dispatch:
  push:
    paths:
      - "instalacion/**"
      - ".github/workflows/build-matchia-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataformas y herramientas Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar carpeta de firma
        run: mkdir -p ~/.android

      - name: Recuperar firma de prueba para mantener actualizaciones compatibles
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: matchia-debug-keystore-v2

      - name: Crear firma estable si todavía no existe
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Poner logo original de MatchIA
        working-directory: instalacion/android
        run: |
          rm -f app/src/main/res/drawable/ic_matchia.xml
          base64 -d app/src/main/icon_matchia.b64 > app/src/main/res/drawable/ic_matchia.jpg

      - name: Compilar APK de prueba
        working-directory: instalacion/android
        run: gradle --no-daemon assembleDebug

      - name: Verificar firma, alineación y datos del APK
        run: |
          APK="instalacion/android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          unzip -t "$APK"

      - name: Publicar APK con enlace directo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p descargas
          cp instalacion/android/app/build/outputs/apk/debug/app-debug.apk descargas/MatchIA.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/MatchIA.apk
          git commit -m "Publicar APK actualizado de MatchIA" || echo "Sin cambios en el APK"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MatchIA-APK-debug
          path: instalacion/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
