name: Bitcoin paper trader tests

on:
  push:
    branches:
      - bitcoin-bot-paper
    paths:
      - "bitcoin-bot/**"
      - ".github/workflows/bitcoin-bot-tests.yml"
  pull_request:
    paths:
      - "bitcoin-bot/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitcoin-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v
