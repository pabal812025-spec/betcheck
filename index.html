<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>BetCheck</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#0d1b2f,#102a43);
  padding:22px 18px;
  border-bottom:1px solid #203752;
}

header h1{
  margin:0;
  color:#38e07b;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  color:#aebdce;
}

main{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.card{
  background:#0d1a2b;
  border:1px solid #203752;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

h2,h3{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #304a67;
  background:#081321;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#38e07b;
  color:#06110b;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#1b3049;
  color:#fff;
}

button.back{
  background:#29435f;
  color:#fff;
  margin-bottom:15px;
}

.match{
  background:#0a1727;
  border:1px solid #29435f;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.match:hover{
  border-color:#38e07b;
}

.teams{
  font-size:18px;
  font-weight:bold;
  line-height:1.4;
}

.muted{
  color:#91a5bb;
  font-size:14px;
  margin-top:5px;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#081321;
  border:1px solid #203752;
  margin-top:12px;
}

.success{
  color:#55ee91;
}

.error{
  color:#ff7070;
}

.live{
  color:#ff5252;
  font-weight:bold;
}

.tag{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:20px;
  background:#163a2b;
  color:#55ee91;
  font-size:12px;
}

.hidden{
  display:none;
}

.detail-title{
  font-size:24px;
  font-weight:bold;
  line-height:1.3;
}

.logos{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin:22px 0;
}

.team{
  width:40%;
  text-align:center;
}

.team img{
  width:65px;
  height:65px;
  object-fit:contain;
  display:block;
  margin:0 auto 8px;
}

.vs{
  color:#91a5bb;
  font-weight:bold;
}

.score{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  color:#38e07b;
  margin:8px 0;
}

.liveBox{
  text-align:center;
  margin:10px 0 22px;
  padding:12px;
  border-radius:12px;
  background:#241016;
  border:1px solid #7a2934;
}

.liveMinute{
  color:#ff5252;
  font-size:20px;
  font-weight:bold;
}

.finishedBox{
  text-align:center;
  margin:10px 0 22px;
  padding:10px;
  border-radius:12px;
  background:#102719;
  border:1px solid #275c3a;
  color:#55ee91;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:#081321;
  border:1px solid #203752;
  border-radius:12px;
  padding:14px;
}

.stat strong{
  display:block;
  color:#38e07b;
  margin-bottom:6px;
}

.value{
  font-size:20px;
  font-weight:bold;
}

.loading{
  text-align:center;
  padding:25px;
  color:#91a5bb;
}

.small{
  font-size:12px;
}

.refreshing{
  text-align:center;
  color:#91a5bb;
  font-size:12px;
  margin-top:10px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .teams{
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ BetCheck</h1>
  <p>Análisis estadístico de partidos</p>
</header>

<main>

  <div id="homeView">

    <section class="card">

      <h2>🔎 Buscar partidos</h2>

      <input
        id="search"
        type="text"
        placeholder="Equipo, liga o país"
      >

      <button id="refreshButton">
        🔄 Actualizar partidos
      </button>

      <div id="status" class="status">
        Cargando partidos...
      </div>

    </section>

    <section class="card">

      <h2>⚽ Partidos de hoy</h2>

      <div id="matches">
        <div class="loading">
          Cargando...
        </div>
      </div>

    </section>

    <section class="card">

      <h2>🎟️ Mi combinada</h2>

      <div id="combo">
        <p class="muted">
          No agregaste partidos todavía.
        </p>
      </div>

      <button id="clearCombo" class="secondary">
        Vaciar combinada
      </button>

    </section>

  </div>

  <div id="detailView" class="hidden">

    <section class="card">

      <button id="backButton" class="back">
        ← Volver a partidos
      </button>

      <div id="detail"></div>

    </section>

  </div>

</main>

<script>

let partidos = [];
let combinada = [];
let liveTimer = null;
let partidoActual = null;

const matchesBox =
  document.getElementById("matches");

const statusBox =
  document.getElementById("status");

const searchBox =
  document.getElementById("search");

const comboBox =
  document.getElementById("combo");

const homeView =
  document.getElementById("homeView");

const detailView =
  document.getElementById("detailView");

const detailBox =
  document.getElementById("detail");


function escapeHTML(valor){

  return String(valor ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function cargar(){

  matchesBox.innerHTML =
    '<div class="loading">⏳ Cargando partidos...</div>';

  statusBox.className = "status";

  statusBox.textContent =
    "Conectando con los datos deportivos...";

  try{

    const response =
      await fetch(
        "/api/fixtures?nocache=" + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Error HTTP " + response.status
      );

    }

    const data =
      await response.json();

    if(!Array.isArray(data)){

      throw new Error(
        "La respuesta no es una lista"
      );

    }

    partidos = data;

    statusBox.className =
      "status success";

    statusBox.textContent =
      "✅ " +
      partidos.length +
      " partidos encontrados.";

    mostrarPartidos(partidos);

  }catch(error){

    console.error(error);

    statusBox.className =
      "status error";

    statusBox.textContent =
      "❌ No se pudieron cargar los partidos.";

    matchesBox.innerHTML = `
      <div class="status error">
        Error al cargar los partidos.
        <br><br>
        Revisá tu conexión e intentá nuevamente.
      </div>
    `;

  }

}


function mostrarPartidos(lista){

  if(!lista.length){

    matchesBox.innerHTML = `
      <div class="status">
        No hay partidos para mostrar.
      </div>
    `;

    return;
  }

  matchesBox.innerHTML = "";

  lista.forEach(function(partido){

    const div =
      document.createElement("div");

    div.className = "match";

    div.innerHTML = `

      <div class="teams">
        ${escapeHTML(partido.home)}
        vs
        ${escapeHTML(partido.away)}
      </div>

      <div class="muted">
        🏆 ${escapeHTML(
          partido.league ||
          "Liga no disponible"
        )}
      </div>

      <div class="muted">
        🌎 ${escapeHTML(
          partido.country ||
          "País no disponible"
        )}
      </div>

      <span class="tag">
        👆 Ver análisis
      </span>

      <button class="detailButton">
        📊 Ver estadísticas
      </button>

      <button class="comboButton">
        + Agregar a combinada
      </button>

    `;

    div
      .querySelector(".detailButton")
      .addEventListener(
        "click",
        function(){
          abrirPartido(partido.id);
        }
      );

    div
      .querySelector(".comboButton")
      .addEventListener(
        "click",
        function(){
          agregar(partido.id);
        }
      );

    matchesBox.appendChild(div);

  });

}


searchBox.addEventListener(
  "input",
  function(){

    const texto =
      searchBox.value
        .toLowerCase()
        .trim();

    if(!texto){

      mostrarPartidos(partidos);

      statusBox.textContent =
        "✅ " +
        partidos.length +
        " partidos encontrados.";

      return;
    }

    const resultados =
      partidos.filter(function(p){

        return (

          String(p.home || "")
            .toLowerCase()
            .includes(texto)

          ||

          String(p.away || "")
            .toLowerCase()
            .includes(texto)

          ||

          String(p.league || "")
            .toLowerCase()
            .includes(texto)

          ||

          String(p.country || "")
            .toLowerCase()
            .includes(texto)

        );

      });

    mostrarPartidos(resultados);

    statusBox.textContent =
      resultados.length +
      " partido(s) encontrado(s).";

  }
);


function obtenerEstadistica(
  lista,
  nombre
){

  const encontrada =
    lista.find(function(stat){

      return stat.tipo === nombre;

    });

  if(!encontrada){

    return "—";

  }

  return encontrada.valor ?? "—";

}


function esEnVivo(estado){

  return [
    "1H",
    "2H",
    "ET",
    "P"
  ].includes(estado);

}


function textoEstado(partido){

  const estado =
    partido.estado;

  if(estado === "1H"){

    return {
      tipo:"live",
      texto:
        "🔴 EN VIVO · " +
        (partido.minuto != null
          ? partido.minuto + "'"
          : "en juego")
    };

  }

  if(estado === "2H"){

    return {
      tipo:"live",
      texto:
        "🔴 EN VIVO · " +
        (partido.minuto != null
          ? partido.minuto + "'"
          : "en juego")
    };

  }

  if(estado === "HT"){

    return {
      tipo:"live",
      texto:"⏸️ ENTRETIEMPO"
    };

  }

  if(estado === "FT"){

    return {
      tipo:"finished",
      texto:"✅ FINALIZADO"
    };

  }

  if(estado === "NS"){

    return {
      tipo:"normal",
      texto:"🕐 NO INICIADO"
    };

  }

  if(estado === "AET"){

    return {
      tipo:"finished",
      texto:"✅ FINALIZADO · TIEMPO EXTRA"
    };

  }

  if(estado === "PEN"){

    return {
      tipo:"finished",
      texto:"🏁 FINALIZADO · PENALES"
    };

  }

  return {
    tipo:"normal",
    texto:
      partido.estadoLargo ||
      estado ||
      "Estado no disponible"
  };

}


function pintarEstado(partido){

  const estado =
    textoEstado(partido);

  if(estado.tipo === "live"){

    return `
      <div class="liveBox">
        <div class="liveMinute">
          ${escapeHTML(estado.texto)}
        </div>
      </div>
    `;

  }

  if(estado.tipo === "finished"){

    return `
      <div class="finishedBox">
        ${escapeHTML(estado.texto)}
      </div>
    `;

  }

  return `
    <div class="status">
      ${escapeHTML(estado.texto)}
    </div>
  `;

}


async function obtenerDatosPartido(id){

  const partidoResponse =
    await fetch(
      "/api/match?id=" +
      encodeURIComponent(id) +
      "&nocache=" +
      Date.now(),
      {
        cache:"no-store"
      }
    );

  if(!partidoResponse.ok){

    throw new Error(
      "No se pudo cargar el partido"
    );

  }

  const partido =
    await partidoResponse.json();

  let stats = [];

  try{

    const statsResponse =
      await fetch(
        "/api/api/stats?id=" +
        encodeURIComponent(id) +
        "&nocache=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(statsResponse.ok){

      const datos =
        await statsResponse.json();

      if(Array.isArray(datos)){

        stats = datos;

      }

    }

  }catch(error){

    console.log(
      "Estadísticas todavía no disponibles",
      error
    );

  }

  return {
    partido,
    stats
  };

}


async function abrirPartido(id){

  clearInterval(liveTimer);
  liveTimer = null;

  partidoActual = id;

  homeView.classList.add("hidden");
  detailView.classList.remove("hidden");

  detailBox.innerHTML = `
    <div class="loading">
      ⏳ Cargando análisis...
    </div>
  `;

  try{

    await cargarDetalle(id, true);

  }catch(error){

    console.error(
      "Error en detalle:",
      error
    );

    detailBox.innerHTML = `
      <div class="status error">
        ❌ No se pudo cargar
        el análisis del partido.
      </div>
    `;

  }

}


async function cargarDetalle(
  id,
  mostrarCarga
){

  if(mostrarCarga){

    detailBox.innerHTML = `
      <div class="loading">
        ⏳ Cargando datos...
      </div>
    `;

  }

  const datos =
    await obtenerDatosPartido(id);

  const partido =
    datos.partido;

  const stats =
    datos.stats;

  partidoActual = id;

  const localStats =
    stats.find(function(equipo){

      return equipo.equipo &&
        Number(equipo.equipo.id) ===
        Number(partido.local.id);

    });

  const visitanteStats =
    stats.find(function(equipo){

      return equipo.equipo &&
        Number(equipo.equipo.id) ===
        Number(partido.visitante.id);

    });

  const local =
    localStats?.estadisticas || [];

  const visitante =
    visitanteStats?.estadisticas || [];

  const cornersLocal =
    obtenerEstadistica(
      local,
      "Corner Kicks"
    );

  const cornersVisitante =
    obtenerEstadistica(
      visitante,
      "Corner Kicks"
    );

  const tirosLocal =
    obtenerEstadistica(
      local,
      "Total Shots"
    );

  const tirosVisitante =
    obtenerEstadistica(
      visitante,
      "Total Shots"
    );

  const arcoLocal =
    obtenerEstadistica(
      local,
      "Shots on Goal"
    );

  const arcoVisitante =
    obtenerEstadistica(
      visitante,
      "Shots on Goal"
    );

  const posesionLocal =
    obtenerEstadistica(
      local,
      "Ball Possession"
    );

  const posesionVisitante =
    obtenerEstadistica(
      visitante,
      "Ball Possession"
    );

  const pasesLocal =
    obtenerEstadistica(
      local,
      "Passes accurate"
    );

  const pasesVisitante =
    obtenerEstadistica(
      visitante,
      "Passes accurate"
    );

  const faltasLocal =
    obtenerEstadistica(
      local,
      "Fouls"
    );

  const faltasVisitante =
    obtenerEstadistica(
      visitante,
      "Fouls"
    );

  const amarillasLocal =
    obtenerEstadistica(
      local,
      "Yellow Cards"
    );

  const amarillasVisitante =
    obtenerEstadistica(
      visitante,
      "Yellow Cards"
    );

  const rojasLocal =
    obtenerEstadistica(
      local,
      "Red Cards"
    );

  const rojasVisitante =
    obtenerEstadistica(
      visitante,
      "Red Cards"
    );

  let fecha =
    "No disponible";

  if(partido.fecha){

    fecha =
      new Date(partido.fecha)
        .toLocaleString(
          "es-AR",
          {
            dateStyle:"medium",
            timeStyle:"short"
          }
        );

  }

  const estadisticasDisponibles =
    stats.length > 0 &&
    (
      local.length > 0 ||
      visitante.length > 0
    );

  const avisoStats =
    estadisticasDisponibles
      ? `
        <div class="status success">
          ✅ Estadísticas disponibles
        </div>
      `
      : `
        <div class="status">
          ⏳ Las estadísticas todavía
          no están disponibles para este partido.
          <br><br>
          BetCheck las volverá a consultar
          automáticamente si el partido está en vivo.
        </div>
      `;

  detailBox.innerHTML = `

    <div class="detail-title">
      ⚽
      ${escapeHTML(partido.local.nombre)}
      vs
      ${escapeHTML(partido.visitante.nombre)}
    </div>

    <div class="muted">
      🏆
      ${escapeHTML(
        partido.liga?.nombre ||
        "Competición no disponible"
      )}
    </div>

    <div class="muted">
      🌎
      ${escapeHTML(
        partido.liga?.pais ||
        "País no disponible"
      )}
    </div>

    <div class="logos">

      <div class="team">

        <img
          src="${partido.local.logo || ""}"
          alt=""
        >

        <strong>
          ${escapeHTML(
            partido.local.nombre
          )}
        </strong>

      </div>

      <div class="vs">
        VS
      </div>

      <div class="team">

        <img
          src="${partido.visitante.logo || ""}"
          alt=""
        >

        <strong>
          ${escapeHTML(
            partido.visitante.nombre
          )}
        </strong>

      </div>

    </div>

    <div class="score">

      ${partido.marcador.local ?? "-"}
      -
      ${partido.marcador.visitante ?? "-"}

    </div>

    ${pintarEstado(partido)}

    <div class="grid">

      <div class="stat">
        <strong>📅 Fecha</strong>
        ${escapeHTML(fecha)}
      </div>

      <div class="stat">
        <strong>📌 Estado</strong>
        ${escapeHTML(
          partido.estadoLargo ||
          partido.estado ||
          "No disponible"
        )}
      </div>

      <div class="stat">
        <strong>🏟️ Estadio</strong>
        ${escapeHTML(
          partido.estadio ||
          "No informado"
        )}
      </div>

      <div class="stat">
        <strong>🧑‍⚖️ Árbitro</strong>
        ${escapeHTML(
          partido.arbitro ||
          "No informado"
        )}
      </div>

    </div>

    <div class="card">

      <h3>
        📊 Estadísticas del partido
      </h3>

      ${avisoStats}

      <div class="grid">

        <div class="stat">

          <strong>
            🚩 Córners
          </strong>

          <div class="value">
            ${cornersLocal}
            -
            ${cornersVisitante}
          </div>

          <div class="muted">
            ${escapeHTML(
              partido.local.nombre
            )}
            -
            ${escapeHTML(
              partido.visitante.nombre
            )}
          </div>

        </div>

        <div class="stat">

          <strong>
            🎯 Tiros totales
          </strong>

          <div class="value">
            ${tirosLocal}
            -
            ${tirosVisitante}
          </div>

        </div>

        <div class="stat">

          <strong>
            🥅 Tiros al arco
          </strong>

          <div class="value">
            ${arcoLocal}
            -
            ${arcoVisitante}
          </div>

        </div>

        <div class="stat">

          <strong>
            ⚽ Goles
          </strong>

          <div class="value">
            ${partido.marcador.local ?? "-"}
            -
            ${partido.marcador.visitante ?? "-"}
          </div>

        </div>

        <div class="stat">

          <strong>
            🟢 Posesión
          </strong>

          <div class="value">
            ${posesionLocal}
            -
            ${posesionVisitante}
          </div>

        </div>

        <div class="stat">

          <strong>
            🔄 Pases precisos
          </strong>

          <div class="value">
            ${pasesLocal}
            -
            ${pasesVisitante}
          </div>

        </div>

        <div class="stat">

          <strong>
            ⚠️ Faltas
          </strong>

          <div class="value">
            ${faltasLocal}
            -
            ${faltasVisitante}
          </div>

        </div>

        <div class="stat">

          <strong>
            🟨 Amarillas
          </strong>

          <div class="value">
            ${amarillasLocal}
            -
            ${amarillasVisitante}
          </div>

        </div>

        <div class="stat">

          <strong>
            🟥 Rojas
          </strong>

          <div class="value">
            ${rojasLocal}
            -
            ${rojasVisitante}
          </div>

        </div>

      </div>

      ${
        esEnVivo(partido.estado)
        ? `
          <div class="refreshing">
            🔄 Actualización automática cada 30 segundos
          </div>
        `
        : ""
      }

    </div>

    <div class="card">

      <h3>
        📈 Análisis BetCheck
      </h3>

      <p class="muted">
        Las estadísticas mostradas provienen
        de los datos deportivos disponibles
        para este partido.
