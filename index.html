<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIA</title>

<style>
body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

.card{
  background:#151c32;
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:15px;
  margin:5px 0;
  border:0;
  border-radius:10px;
  background:#26345c;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<h1>⚽ MatchIA</h1>

<div class="card">

<h2>River <span id="riverScore">0</span> - <span id="bocaScore">0</span> Boca</h2>

<p>Minuto: <span id="minute">0</span>'</p>

</div>

<div class="card">

<h3>📊 Estadísticas</h3>

<p>
Tiros:
<span id="riverShots">0</span> -
<span id="bocaShots">0</span>
</p>

<p>
Tiros al arco:
<span id="riverTarget">0</span> -
<span id="bocaTarget">0</span>
</p>

<p>
Llegadas:
<span id="riverChances">0</span> -
<span id="bocaChances">0</span>
</p>

</div>

<div class="card">

<button onclick="addMinute()">+1 minuto</button>

<button onclick="riverChance()">
🔥 Llegada River
</button>

<button onclick="bocaChance()">
🔥 Llegada Boca
</button>

<button onclick="riverWide()">
🥅 Tiro afuera River
</button>

<button onclick="bocaWide()">
🥅 Tiro afuera Boca
</button>

<button onclick="riverTarget()">
🎯 Al arco River
</button>

<button onclick="bocaTarget()">
🎯 Al arco Boca
</button>

<button onclick="riverGoal()">
⚽ Gol River
</button>

<button onclick="bocaGoal()">
⚽ Gol Boca
</button>

<button onclick="resetMatch()">
🔄 Reiniciar
</button>

</div>

<script>

let minute = 0;

let riverScore = 0;
let bocaScore = 0;

let riverShots = 0;
let bocaShots = 0;

let riverTargetCount = 0;
let bocaTargetCount = 0;

let riverChances = 0;
let bocaChances = 0;


function update(){

document.getElementById("minute").textContent = minute;

document.getElementById("riverScore").textContent = riverScore;
document.getElementById("bocaScore").textContent = bocaScore;

document.getElementById("riverShots").textContent = riverShots;
document.getElementById("bocaShots").textContent = bocaShots;

document.getElementById("riverTarget").textContent = riverTargetCount;
document.getElementById("bocaTarget").textContent = bocaTargetCount;

document.getElementById("riverChances").textContent = riverChances;
document.getElementById("bocaChances").textContent = bocaChances;

}


function addMinute(){

if(minute < 90){
minute++;
}

update();

}


/* LLEGADA */

function riverChance(){

riverChances++;
riverShots++;

update();

}


function bocaChance(){

bocaChances++;
bocaShots++;

update();

}


/* TIRO AFUERA */

function riverWide(){

riverChances++;
riverShots++;

update();

}


function bocaWide(){

bocaChances++;
bocaShots++;

update();

}


/* AL ARCO */

function riverTarget(){

riverChances++;
riverShots++;
riverTargetCount++;

update();

}


function bocaTarget(){

bocaChances++;
bocaShots++;
bocaTargetCount++;

update();

}


/* GOL */

function riverGoal(){

riverScore++;

riverChances++;
riverShots++;
riverTargetCount++;

update();

}


function bocaGoal(){

bocaScore++;

bocaChances++;
bocaShots++;
bocaTargetCount++;

update();

}


/* REINICIAR */

function resetMatch(){

minute = 0;

riverScore = 0;
bocaScore = 0;

riverShots = 0;
bocaShots = 0;

riverTargetCount = 0;
bocaTargetCount = 0;

riverChances = 0;
bocaChances = 0;

update();

}


update();

</script>

</body>
</html>
