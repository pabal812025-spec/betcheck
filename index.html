<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchIA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #0b1728;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px;
      background: #0d1b2e;
      border-bottom: 1px solid #1d3048;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #35e08b;
    }

    .header-icons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: #16263d;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    .content {
      padding: 16px;
    }

    .section-title {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 800;
    }

    .match-card {
      background: #101f34;
      border: 1px solid #203653;
      border-radius: 18px;
      padding: 16px;
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      color: #9db0c8;
      font-size: 13px;
    }

    .live {
      color: #35e08b;
      font-weight: 800;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      align-items: center;
      gap: 8px;
    }

    .team {
      text-align: center;
    }

    .team-name {
      font-size: 17px;
      font-weight: 700;
    }

    .score {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
    }

    .minute {
      margin-top: 4px;
      text-align: center;
      color: #35e08b;
      font-size: 13px;
      font-weight: 700;
    }

    .time-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
    }

    .time-btn {
      width: 34px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: #1a304d;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .time-btn:hover,
    .stat-btn:hover {
      background: #2a486d;
    }

    .time-label {
      min-width: 48px;
      text-align: center;
      color: #9db0c8;
      font-size: 12px;
    }

    .probabilities {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .prob {
      padding: 10px 6px;
      background: #0b1728;
      border-radius: 12px;
      text-align: center;
    }

    .prob-value {
      color: #35e08b;
      font-size: 22px;
      font-weight: 800;
    }

    .prob-label {
      margin-top: 4px;
      color: #9db0c8;
      font-size: 11px;
    }

    .stats {
      margin-top: 20px;
    }

    .stats-title {
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      align-items: center;
      gap: 6px;
      margin: 9px 0;
    }

    .stat-side {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-side.right {
      justify-content: flex-end;
    }

    .stat-number {
      min-width: 22px;
      text-align: center;
      font-weight: 700;
    }

    .stat-name {
      text-align: center;
      color: #8fa3bc;
      font-size: 11px;
    }

    .stat-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: #1a304d;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      line-height: 28px;
      cursor: pointer;
    }

    .analysis {
      margin-top: 18px;
      padding: 13px;
      background: #0b1728;
      border-radius: 12px;
      color: #c5d2e2;
      font-size: 13px;
      line-height: 1.45;
    }

    .analysis strong {
      color: #ffffff;
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="logo">

    </div>

    <div class="header-icons">

          <div class="time-controls">

        <div class="team">

      <div class="probabilities">

        <div class="prob">

          <div class="stat-side">

            <button

            >

            </button>

          </div>


          <div class="stat-name">
            🔥 Llegadas
          </div>


          <div class="stat-side right">

            <button
              type="button"
              class="stat-btn"

            >
              −
            </button>

            <span

            >
              0

            <button
              type="button"

              onclick="changeStat('away','arrival',1)"

              +

            <button

          </div>


          <div class="stat-name">

          <div class="stat-side right">

            <button
              type="button"
              class="stat-btn"

            </button>

            <span

            </span>

            <button
              type="button"

          </div>

        </div>


        <!-- AL ARCO -->

          <div class="stat-side">

            <button

            >

            <span

              class="stat-number"
            >
              0
            </span>

            <button
              type="button"
              class="stat-btn"
              onclick="changeStat('home','target',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🎯 Al arco
          </div>


          <div class="stat-side right">

            <button
              type="button"
              class="stat-btn"
              onclick="changeStat('away','target',-1)"
            >
              −
            </button>

            <span
              id="awayOnTarget"

            >
              0
            </span>

            <button

              onclick="changeStat('away','target',1)"

          </div>

        </div>


        <!-- GOLES -->

          <div class="stat-side">

              onclick="changeStat('home','goal',-1)"

            <span

            >
              0
            </span>

            <button
              type="button"
              class="stat-btn"
              onclick="changeStat('home','goal',1)"

              +
            </button>

          </div>


          <div class="stat-name">

          </div>


          <div class="stat-side right">

            <button
              type="button"

              onclick="changeStat('away','goal',-1)"

              −

            <span

            >
              0
            </span>

        <!-- CORNERS -->

        <!-- ROJAS -->

          <div class="stat-side">

              −

            <span

            >
              0

            <button
              type="button"
              class="stat-btn"
              onclick="changeStat('home','red',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🟥 Rojas
          </div>


          <div class="stat-side right">

            <button
              type="button"
              class="stat-btn"

            >
              −

            <span

            >

      </div>


      <div class="analysis">

        </div>

      </div>

  </main>

</div>


<script>

  /*
   * ==========================================
   * ESTADO DEL PARTIDO
   * ==========================================
   */

  const match = {

    minute: 89,

    homeGoals: 0,
    awayGoals: 0,

    homeArrivals: 0,
    awayArrivals: 0,

    homeShots: 0,
    awayShots: 0,

    homeOnTarget: 0,
    awayOnTarget: 0,

    homeCorners: 0,
    awayCorners: 0,

    homeReds: 0,
    awayReds: 0

  };


  /*
   * ==========================================
   * UTILIDADES
   * ==========================================
   */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  /*
   * ==========================================
   * MINUTO
   * ==========================================
   */

  function changeMinute(amount) {

    match.minute = clamp(
      match.minute + amount,
      0,
      90
    );

    render();

  }


  /*
   * ==========================================
   * MOTOR DE PROBABILIDADES
   * ==========================================
   */

  function calculateProbabilities() {

    const minute = clamp(
      Number(match.minute) || 0,
      0,
      90
    );


    const hg = Number(match.homeGoals) || 0;
    const ag = Number(match.awayGoals) || 0;

    const ha = Number(match.homeArrivals) || 0;
    const aa = Number(match.awayArrivals) || 0;

    const hs = Number(match.homeShots) || 0;
    const as = Number(match.awayShots) || 0;

    const hot = Number(match.homeOnTarget) || 0;
    const aot = Number(match.awayOnTarget) || 0;

    const hc = Number(match.homeCorners) || 0;
    const ac = Number(match.awayCorners) || 0;

    const homeReds = Number(match.homeReds) || 0;
    const awayReds = Number(match.awayReds) || 0;


    /*
     * BASE
     */

    let home = 33;
    let draw = 34;
    let away = 33;


    /*
     * LLEGADAS
     */

    const arrivalDiff = ha - aa;

    home += arrivalDiff * 0.55;
    away -= arrivalDiff * 0.55;


    /*
     * TIROS
     */

    const shotDiff = hs - as;

    home += shotDiff * 0.30;
    away -= shotDiff * 0.30;


    /*
     * TIROS AL ARCO
     */

    const targetDiff = hot - aot;

    home += targetDiff * 1.15;
    away -= targetDiff * 1.15;


    /*
     * CÓRNERS
     */

    const cornerDiff = hc - ac;

    home += cornerDiff * 0.20;
    away -= cornerDiff * 0.20;


    /*
     * MARCADOR
     */

    const goalDiff = hg - ag;

    let goalWeight = 4.5;


    if (minute <= 15) {

      goalWeight = 4.5;

    } else if (minute <= 30) {

      goalWeight = 6.0;

    } else if (minute <= 45) {

      goalWeight = 7.5;

    } else if (minute <= 60) {

      goalWeight = 9.0;

    } else if (minute <= 75) {

      goalWeight = 12.0;

    } else if (minute <= 85) {

      goalWeight = 16.0;

    } else {

      goalWeight = 22.0;

    }


    home += goalDiff * goalWeight;
    away -= goalDiff * goalWeight;

    draw -=
      Math.abs(goalDiff) *
      (goalWeight * 0.35);


    /*
     * SI ESTÁN EMPATADOS
     */

    if (goalDiff === 0) {

      const timeWeight =
        Math.min(minute, 90) / 90;

      draw += timeWeight * 8;

      home -= timeWeight * 4;
      away -= timeWeight * 4;

    }


    /*
     * ROJAS
     */

    const redDifference =
      awayReds - homeReds;

    home += redDifference * 7;
    away -= redDifference * 7;


    if (homeReds > 0) {

      away += homeReds * 2;
      home -= homeReds * 2;

    }


    if (awayReds > 0) {

      home += awayReds * 2;
      away -= awayReds * 2;

    }


    /*
     * ========================================
     * CIERRE DE PARTIDO
     * ========================================
     */

    if (minute >= 85) {

      let lateTarget =
        90 +
        7.5 *
        Math.pow(
          (Math.min(minute, 90) - 85) / 5,
          1.15
        );


      lateTarget = clamp(
        lateTarget,
        90,
        97.5
      );


      const remaining =
        100 - lateTarget;


      /*
       * EMPATE
       */

      if (hg === ag) {

        const positiveHome =
          Math.max(home, 0);

        const positiveAway =
          Math.max(away, 0);

        const nonDraw =
          positiveHome + positiveAway;


        if (nonDraw > 0) {

          home =
            (positiveHome / nonDraw) *
            remaining;

          away =
            (positiveAway / nonDraw) *
            remaining;

        } else {

          home = remaining / 2;
          away = remaining / 2;

        }


        draw = lateTarget;

      }


      /*
       * LOCAL GANANDO
       */

      else if (hg > ag) {

        const goalLead =
          hg - ag;


        /*
         * 89' o más y 4+ goles
         */

        if (
          minute >= 89 &&
          goalLead >= 4
        ) {

          home = 100;
          draw = 0;
          away = 0;

        }


        /*
         * 89' o más y 3 goles
         */

        else if (
          minute >= 89 &&
          goalLead === 3
        ) {

          home = 99.6;
          draw = 0.25;
          away = 0.15;

        }


        /*
         * 89' o más y 2 goles
         */

        else if (
          minute >= 89 &&
          goalLead === 2
        ) {

          home = 99.0;
          draw = 0.7;
          away = 0.3;

        }


        /*
         * RESTO
         */

        else {

          const positiveDraw =
            Math.max(draw, 0);

          const positiveAway =
            Math.max(away, 0);

          const nonHome =
            positiveDraw + positiveAway;


          home = lateTarget;


          if (nonHome > 0) {

            draw =
              (positiveDraw / nonHome) *
              remaining;

            away =
              (positiveAway / nonHome) *
              remaining;

          } else {

            draw =
              remaining * 0.75;

            away =
              remaining * 0.25;

          }

        }

      }


      /*
       * VISITANTE GANANDO
       */

      else {

        const goalLead =
          ag - hg;


        /*
         * 89' o más y 4+ goles
         */

        if (
          minute >= 89 &&
          goalLead >= 4
        ) {

          away = 100;
          draw = 0;
          home = 0;

        }


        /*
         * 89' o más y 3 goles
         */

        else if (
          minute >= 89 &&
          goalLead === 3
        ) {

          away = 99.6;
          draw = 0.25;
          home = 0.15;

        }


        /*
         * 89' o más y 2 goles
         */

        else if (
          minute >= 89 &&
          goalLead === 2
        ) {

          away = 99.0;
          draw = 0.7;
          home = 0.3;

        }


        /*
         * RESTO
         */

        else {

          const positiveHome =
            Math.max(home, 0);

          const positiveDraw =
            Math.max(draw, 0);

          const nonAway =
            positiveHome + positiveDraw;


          away = lateTarget;


          if (nonAway > 0) {

            home =
              (positiveHome / nonAway) *
              remaining;

            draw =
              (positiveDraw / nonAway) *
              remaining;

          } else {

            home =
              remaining * 0.25;

            draw =
              remaining * 0.75;

          }

        }

      }

    }


    /*
     * MÍNIMOS ANTES DE 85'
     */

    if (minute < 85) {

      const minimumProbability =
        minute < 75 ? 8 : 3;


      home = clamp(
        home,
        minimumProbability,
        94
      );

      draw = clamp(
        draw,
        minimumProbability,
        94
      );

      away = clamp(
        away,
        minimumProbability,
        94
      );

    }


    /*
     * SEGURIDAD
     */

    home = Math.max(home, 0);
    draw = Math.max(draw, 0);
    away = Math.max(away, 0);


    const total =
      home + draw + away;


    if (
      !Number.isFinite(total) ||
      total <= 0
    ) {

      return {
        home: 33,
        draw: 34,
        away: 33
      };

    }


    return {

      home:
        (home / total) * 100,

      draw:
        (draw / total) * 100,

      away:
        (away / total) * 100

    };

  }


  /*
   * ==========================================
   * CAMBIAR ESTADÍSTICAS
   * ==========================================
   */

  function changeStat(
    team,
    stat,
    amount
  ) {

    const prefix =
      team === 'home'
        ? 'home'
        : 'away';


    /*
     * LLEGADA
     *
     * Solo modifica llegada.
     */

    if (stat === 'arrival') {

      if (amount > 0) {

        match[prefix + 'Arrivals'] += 1;

      } else {

        match[prefix + 'Arrivals'] =
          Math.max(
            0,
            match[prefix + 'Arrivals'] - 1
          );

      }

    }


    /*
     * TIRO
     *
     * Tiro = tiro + llegada.
     */

    else if (stat === 'shot') {

      if (amount > 0) {

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      } else {

        if (match[prefix + 'Shots'] > 0) {

          match[prefix + 'Shots'] -= 1;

          match[prefix + 'Arrivals'] =
            Math.max(
              0,
              match[prefix + 'Arrivals'] - 1
            );

        }

      }

    }


    /*
     * TIRO AL ARCO
     *
     * Al arco = tiro + llegada.
     */

    else if (stat === 'target') {

      if (amount > 0) {

        match[prefix + 'OnTarget'] += 1;

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      } else {

        if (match[prefix + 'OnTarget'] > 0) {

          match[prefix + 'OnTarget'] -= 1;

          match[prefix + 'Shots'] =
            Math.max(
              0,
              match[prefix + 'Shots'] - 1
            );

          match[prefix + 'Arrivals'] =
            Math.max(
              0,
              match[prefix + 'Arrivals'] - 1
            );

        }

      }

    }


    /*
     * GOL
     *
     * Gol = al arco + tiro + llegada.
     */

    else if (stat === 'goal') {

      if (amount > 0) {

        match[prefix + 'Goals'] += 1;

        match[prefix + 'OnTarget'] += 1;

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      } else {

        if (match[prefix + 'Goals'] > 0) {

          match[prefix + 'Goals'] -= 1;

          match[prefix + 'OnTarget'] =
            Math.max(
              0,
              match[prefix + 'OnTarget'] - 1
            );

          match[prefix + 'Shots'] =
            Math.max(
              0,
              match[prefix + 'Shots'] - 1
            );

          match[prefix + 'Arrivals'] =
            Math.max(
              0,
              match[prefix + 'Arrivals'] - 1
            );

        }

      }

    }


    /*
     * CÓRNER
     */

    else if (stat === 'corner') {

      if (amount > 0) {

        match[prefix + 'Corners'] += 1;

      } else {

        match[prefix + 'Corners'] =
          Math.max(
            0,
            match[prefix + 'Corners'] - 1
          );

      }

    }


    /*
     * ROJA
     */

    else if (stat === 'red') {

      if (amount > 0) {

        match[prefix + 'Reds'] += 1;

      } else {

        match[prefix + 'Reds'] =
          Math.max(
            0,
            match[prefix + 'Reds'] - 1
          );

      }

    }


    render();

  }


  /*
   * ==========================================
   * RENDER
   * ==========================================
   */

  function render() {

    document.getElementById('homeGoals').textContent =
      match.homeGoals;

    document.getElementById('awayGoals').textContent =
      match.awayGoals;


    document.getElementById('homeGoalsStat').textContent =
      match.homeGoals;

    document.getElementById('awayGoalsStat').textContent =
      match.awayGoals;


    document.getElementById('minute').textContent =
      match.minute;


    document.getElementById('homeArrivals').textContent =
      match.homeArrivals;

    document.getElementById('awayArrivals').textContent =
      match.awayArrivals;


    document.getElementById('homeShots').textContent =
      match.homeShots;

    document.getElementById('awayShots').textContent =
      match.awayShots;


    document.getElementById('homeOnTarget').textContent =
      match.homeOnTarget;

    document.getElementById('awayOnTarget').textContent =
      match.awayOnTarget;


    document.getElementById('homeCorners').textContent =
      match.homeCorners;

    document.getElementById('awayCorners').textContent =
      match.awayCorners;


    document.getElementById('homeReds').textContent =
      match.homeReds;

    document.getElementById('awayReds').textContent =
      match.awayReds;


    const probabilities =
      calculateProbabilities();


    document.getElementById('homeProb').textContent =
      Math.round(probabilities.home) + '%';

    document.getElementById('drawProb').textContent =
      Math.round(probabilities.draw) + '%';

    document.getElementById('awayProb').textContent =
      Math.round(probabilities.away) + '%';


    updateAnalysis();

  }


  /*
   * ==========================================
   * ANÁLISIS
   * ==========================================
   */

  function updateAnalysis() {

    const minute =
      match.minute;

    const hg =
      match.homeGoals;

    const ag =
      match.awayGoals;


    let text =
      minute +
      "' · " +
      hg +
      "-" +
      ag +
      ". ";


    if (hg === ag) {

      text +=
        "El marcador está igualado y todavía puede producirse un cambio en el resultado.";

    }

    else if (hg > ag) {

      const difference =
        hg - ag;


      if (
        minute >= 89 &&
        difference >= 4
      ) {

        text +=
          "Queda muy poco tiempo y la diferencia de goles hace que el resultado esté prácticamente cerrado.";

      }

      else if (
        minute >= 89 &&
        difference >= 2
      ) {

        text +=
          "Queda muy poco tiempo y la diferencia de goles concentra casi toda la probabilidad en River.";

      }

      else {

        text +=
          "River está por delante en el marcador y el tiempo restante aumenta el peso del resultado actual.";

      }

    }

    else {

      const difference =
        ag - hg;


      if (
        minute >= 89 &&
        difference >= 4
      ) {

        text +=
          "Queda muy poco tiempo y la diferencia de goles hace que el resultado esté prácticamente cerrado.";

      }

      else if (
        minute >= 89 &&
        difference >= 2
      ) {

        text +=
          "Queda muy poco tiempo y la diferencia de goles concentra casi toda la probabilidad en Boca.";

      }

      else {

        text +=
          "Boca está por delante en el marcador y el tiempo restante aumenta el peso del resultado actual.";

      }

    }


    document.getElementById('analysisText').textContent =
      text;

  }


  /*
   * ==========================================
   * BOTONES SUPERIORES
   * ==========================================
   */

  function showMessage(message) {

    alert(message);

  }


  /*
   * ==========================================
   * INICIO
   * ==========================================
   */

  render();

</script>
