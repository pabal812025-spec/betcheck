<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchIA</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  padding:18px;
  background:#0b1728;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  color:#35e0a1;
  font-size:25px;
  font-weight:800;
}

.header-icons{
  display:flex;
  gap:10px;
}

.icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#14243a;
  display:flex;
  justify-content:center;
  align-items:center;
}

.match-card,
.stats-card{
  background:#102039;
  border:1px solid #1d3553;
  border-radius:18px;
  padding:18px;
}

.match-title{
  text-align:center;
  color:#8fa7c4;
  font-size:13px;
  margin-bottom:18px;
}

.live{
  color:#ff4d5d;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}

.team{
  text-align:center;
}

.team-name{
  font-size:19px;
  font-weight:700;
}

.score{
  font-size:30px;
  font-weight:800;
}

.minute{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:18px;
}

.minute-value{
  min-width:70px;
  text-align:center;
  font-size:18px;
  font-weight:800;
}

.btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#1b304b;
  color:#fff;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

.btn:active{
  background:#29496b;
  transform:scale(.94);
}

.probabilities{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:20px;
}

.prob{
  background:#0b1728;
  border-radius:12px;
  padding:12px 4px;
  text-align:center;
}

.prob-value{
  font-size:20px;
  font-weight:800;
}

.prob-label{
  margin-top:4px;
  color:#91a7c0;
  font-size:12px;
}

.stats-card{
  margin-top:18px;
}

.section-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:14px;
}

.stat{
  display:grid;
  grid-template-columns:1fr 105px 1fr;
  align-items:center;
  min-height:52px;
  border-bottom:1px solid #1a304b;
}

.stat:last-child{
  border-bottom:0;
}

.side{
  display:flex;
  align-items:center;
  gap:6px;
}

.side.right{
  justify-content:flex-end;
}

.number{
  min-width:24px;
  text-align:center;
  font-size:16px;
  font-weight:bold;
}

.label{
  text-align:center;
  color:#b7c8da;
  font-size:12px;
}

.message{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#102039;
  color:#b7c8da;
  font-size:14px;
  line-height:1.4;
}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      ⚽ MatchIA
    </div>

    <div class="header-icons">
      <div class="icon">🔔</div>
      <div class="icon">⚙️</div>
    </div>

  </div>


  <div class="match-card">

    <div class="match-title">
      Demo · Partido en vivo
      <span class="live">● EN VIVO</span>
    </div>


    <div class="teams">

      <div class="team">
        <div class="team-name">River</div>
      </div>

      <div class="score">

        <span id="homeGoals">0</span>
        -
        <span id="awayGoals">0</span>

      </div>

      <div class="team">
        <div class="team-name">Boca</div>
      </div>

    </div>


    <div class="minute">

      <button
        type="button"
        class="btn"
        onclick="changeMinute(-1)">
        −
      </button>

      <div class="minute-value">
        <span id="minute">0</span>'
      </div>

      <button
        type="button"
        class="btn"
        onclick="changeMinute(1)">
        +
      </button>

    </div>


    <div class="probabilities">

      <div class="prob">
        <div class="prob-value" id="homeProbability">33%</div>
        <div class="prob-label">River</div>
      </div>

      <div class="prob">
        <div class="prob-value" id="drawProbability">34%</div>
        <div class="prob-label">Empate</div>
      </div>

      <div class="prob">
        <div class="prob-value" id="awayProbability">33%</div>
        <div class="prob-label">Boca</div>
      </div>

    </div>

  </div>


  <div class="stats-card">

    <div class="section-title">
      Estadísticas
    </div>


    <!-- LLEGADAS -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','arrivals',-1)">−</button>

        <span class="number" id="homeArrivals">0</span>

        <button class="btn" onclick="changeStat('home','arrivals',1)">+</button>

      </div>

      <div class="label">
        🔥 Llegadas
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','arrivals',-1)">−</button>

        <span class="number" id="awayArrivals">0</span>

        <button class="btn" onclick="changeStat('away','arrivals',1)">+</button>

      </div>

    </div>


    <!-- TIROS -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','shots',-1)">−</button>

        <span class="number" id="homeShots">0</span>

        <button class="btn" onclick="changeStat('home','shots',1)">+</button>

      </div>

      <div class="label">
        🎯 Tiros
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','shots',-1)">−</button>

        <span class="number" id="awayShots">0</span>

        <button class="btn" onclick="changeStat('away','shots',1)">+</button>

      </div>

    </div>


    <!-- AL ARCO -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','target',-1)">−</button>

        <span class="number" id="homeTarget">0</span>

        <button class="btn" onclick="changeStat('home','target',1)">+</button>

      </div>

      <div class="label">
        🎯 Al arco
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','target',-1)">−</button>

        <span class="number" id="awayTarget">0</span>

        <button class="btn" onclick="changeStat('away','target',1)">+</button>

      </div>

    </div>


    <!-- GOLES -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','goals',-1)">−</button>

        <span class="number" id="homeGoalsStat">0</span>

        <button class="btn" onclick="changeStat('home','goals',1)">+</button>

      </div>

      <div class="label">
        ⚽ Goles
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','goals',-1)">−</button>

        <span class="number" id="awayGoalsStat">0</span>

        <button class="btn" onclick="changeStat('away','goals',1)">+</button>

      </div>

    </div>


    <!-- CÓRNERS -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','corners',-1)">−</button>

        <span class="number" id="homeCorners">0</span>

        <button class="btn" onclick="changeStat('home','corners',1)">+</button>

      </div>

      <div class="label">
        🚩 Córners
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','corners',-1)">−</button>

        <span class="number" id="awayCorners">0</span>

        <button class="btn" onclick="changeStat('away','corners',1)">+</button>

      </div>

    </div>


    <!-- AMARILLAS -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','yellows',-1)">−</button>

        <span class="number" id="homeYellows">0</span>

        <button class="btn" onclick="changeStat('home','yellows',1)">+</button>

      </div>

      <div class="label">
        🟨 Amarillas
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','yellows',-1)">−</button>

        <span class="number" id="awayYellows">0</span>

        <button class="btn" onclick="changeStat('away','yellows',1)">+</button>

      </div>

    </div>


    <!-- ROJAS -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','reds',-1)">−</button>

        <span class="number" id="homeReds">0</span>

        <button class="btn" onclick="changeStat('home','reds',1)">+</button>

      </div>

      <div class="label">
        🟥 Rojas
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','reds',-1)">−</button>

        <span class="number" id="awayReds">0</span>

        <button class="btn" onclick="changeStat('away','reds',1)">+</button>

      </div>

    </div>


    <!-- FALTAS -->

    <div class="stat">

      <div class="side">

        <button class="btn" onclick="changeStat('home','fouls',-1)">−</button>

        <span class="number" id="homeFouls">0</span>

        <button class="btn" onclick="changeStat('home','fouls',1)">+</button>

      </div>

      <div class="label">
        ⚠️ Faltas
      </div>

      <div class="side right">

        <button class="btn" onclick="changeStat('away','fouls',-1)">−</button>

        <span class="number" id="awayFouls">0</span>

        <button class="btn" onclick="changeStat('away','fouls',1)">+</button>

      </div>

    </div>

  </div>


  <div class="message" id="message">
    0' · River 0-0 Boca
  </div>

</div>


<script>

/* =====================================================
   DATOS
===================================================== */

const match = {

  minute: 0,

  home: {
    arrivals: 0,
    shots: 0,
    target: 0,
    goals: 0,
    corners: 0,
    yellows: 0,
    reds: 0,
    fouls: 0
  },

  away: {
    arrivals: 0,
    shots: 0,
    target: 0,
    goals: 0,
    corners: 0,
    yellows: 0,
    reds: 0,
    fouls: 0
  }

};


/* =====================================================
   CURVA DEL EMPATE
===================================================== */

function getDrawCurve(minute){

  if(minute <= 60){

    return 34 + (minute / 60) * 20;

  }

  if(minute <= 75){

    const progress = (minute - 60) / 15;

    return 54 + progress * 14;

  }

  if(minute <= 80){

    const progress = (minute - 75) / 5;

    return 68 + progress * 6;

  }

  if(minute <= 84){

    const progress = (minute - 80) / 4;

    return 74 + progress * 8;

  }

  if(minute === 85) return 90;
  if(minute === 86) return 92;
  if(minute === 87) return 94;
  if(minute === 88) return 96;
  if(minute === 89) return 98;

  return 99;

}


/* =====================================================
   CAMBIO DE MINUTO
===================================================== */

function changeMinute(amount){

  match.minute += amount;

  if(match.minute < 0){
    match.minute = 0;
  }

  if(match.minute > 90){
    match.minute = 90;
  }

  render();

}


/* =====================================================
   CAMBIO DE ESTADÍSTICAS
===================================================== */

function changeStat(team,stat,amount){

  const side = match[team];


  /* AGREGAR */

  if(amount === 1){

    if(stat === "goals"){

      side.goals += 1;
      side.target += 1;
      side.shots += 1;
      side.arrivals += 1;

    }

    else if(stat === "target"){

      side.target += 1;
      side.shots += 1;
      side.arrivals += 1;

    }

    else if(stat === "shots"){

      side.shots += 1;
      side.arrivals += 1;

    }

    else if(stat === "arrivals"){

      side.arrivals += 1;

    }

    else if(stat === "corners"){

      side.corners += 1;

    }

    else if(stat === "yellows"){

      side.yellows += 1;

    }

    else if(stat === "reds"){

      side.reds += 1;

    }

    else if(stat === "fouls"){

      side.fouls += 1;

    }

  }


  /* QUITAR */

  if(amount === -1){

    if(stat === "goals" && side.goals > 0){

      side.goals -= 1;

      side.target = Math.max(0,side.target - 1);
      side.shots = Math.max(0,side.shots - 1);
      side.arrivals = Math.max(0,side.arrivals - 1);

    }

    else if(stat === "target" && side.target > 0){

      side.target -= 1;

      side.shots = Math.max(0,side.shots - 1);
      side.arrivals = Math.max(0,side.arrivals - 1);

    }

    else if(stat === "shots" && side.shots > 0){

      side.shots -= 1;

      side.arrivals = Math.max(0,side.arrivals - 1);

    }

    else if(stat === "arrivals" && side.arrivals > 0){

      side.arrivals -= 1;

    }

    else if(stat === "corners" && side.corners > 0){

      side.corners -= 1;

    }

    else if(stat === "yellows" && side.yellows > 0){

      side.yellows -= 1;

    }

    else if(stat === "reds" && side.reds > 0){

      side.reds -= 1;

    }

    else if(stat === "fouls" && side.fouls > 0){

      side.fouls -= 1;

    }

  }


  render();

}


/* =====================================================
   CÁLCULO DE PROBABILIDADES
===================================================== */

function calculateProbabilities(){

  const minute = match.minute;

  const hg = match.home.goals;
  const ag = match.away.goals;

  const ha = match.home.arrivals;
  const aa = match.away.arrivals;

  const hs = match.home.shots;
  const as = match.away.shots;

  const hot = match.home.target;
  const aot = match.away.target;

  const hc = match.home.corners;
  const ac = match.away.corners;

  const homeReds = match.home.reds;
  const awayReds = match.away.reds;

  const goalDiff = hg - ag;


  /*
  BASE
  */

  let home = 33;
  let draw = 34;
  let away = 33;


  /*
  PRESIÓN POR LLEGADAS
  */

  const arrivalDiff = ha - aa;

  home += arrivalDiff * 0.55;
  away -= arrivalDiff * 0.55;


  /*
  TIROS
  */

  const shotDiff = hs - as;

  home += shotDiff * 0.30;
  away -= shotDiff * 0.30;


  /*
  TIROS AL ARCO
  */

  const targetDiff = hot - aot;

  home += targetDiff * 1.15;
  away -= targetDiff * 1.15;


  /*
  CÓRNERS
  */

  const cornerDiff = hc - ac;

  home += cornerDiff * 0.20;
  away -= cornerDiff * 0.20;


  /*
  PESO DEL RESULTADO
  */

  let goalWeight;

  if(minute <= 15){

    goalWeight = 4.5;

  }
  else if(minute <= 30){

    goalWeight = 6.0;

  }
  else if(minute <= 45){

    goalWeight = 7.5;

  }
  else if(minute <= 60){

    goalWeight = 9.0;

  }
  else if(minute <= 75){

    goalWeight = 12.0;

  }
  else if(minute <= 85){

    goalWeight = 16.0;

  }
  else{

    goalWeight = 22.0;

  }


  home += goalDiff * goalWeight;
  away -= goalDiff * goalWeight;

  draw -= Math.abs(goalDiff) * (goalWeight * 0.35);


  /*
  ROJAS
  */

  const redDifference = awayReds - homeReds;

  home += redDifference * 7;
  away -= redDifference * 7;


  if(homeReds > 0){

    away += homeReds * 2;
    home -= homeReds * 2;

  }


  if(awayReds > 0){

    home += awayReds * 2;
    away -= awayReds * 2;

  }


  /*
  =====================================================
  0-0: CURVA EXACTA DEL EMPATE
  =====================================================
  */

  if(goalDiff === 0){

    const curveDraw = getDrawCurve(minute);

    const remaining = 100 - curveDraw;

    const homePressure = Math.max(0,home - 33);
    const awayPressure = Math.max(0,away - 33);

    let homeShare = 0.5;
    let awayShare = 0.5;

    const pressureTotal =
      homePressure + awayPressure;


    if(pressureTotal > 0){

      homeShare =
        homePressure / pressureTotal;

      awayShare =
        awayPressure / pressureTotal;

    }


    home = remaining * homeShare;
    away = remaining * awayShare;
    draw = curveDraw;

  }


  /*
  =====================================================
  ROJA:
  NUNCA DEJAR EN 0 AL EQUIPO EXPULSADO
  =====================================================
  */

  if(minute < 90){

    if(homeReds > 0){

      home = Math.max(home,2);

    }

    if(awayReds > 0){

      away = Math.max(away,2);

    }

  }


  /*
  =====================================================
  AJUSTE DE UN GOL DE DIFERENCIA MUY TARDE
  =====================================================
  */

  if(
    minute >= 85 &&
    Math.abs(goalDiff) === 1
  ){

    let leaderTarget;

    if(minute === 85){

      leaderTarget = 86;

    }
    else if(minute === 86){

      leaderTarget = 88;

    }
    else if(minute === 87){

      leaderTarget = 90;

    }
    else if(minute === 88){

      leaderTarget = 93;

    }
    else if(minute === 89){

      leaderTarget = 96;

    }
    else{

      leaderTarget = 98;

    }


    const remaining =
      100 - leaderTarget;


    let drawShare =
      remaining * 0.80;

    let losingShare =
      remaining - drawShare;


    /*
    Si el equipo que gana tiene roja,
    dejamos un poco más de espacio
    para el empate y el rival.
    */

    if(hg > ag && homeReds > 0){

      drawShare = remaining * 0.70;

      losingShare =
        remaining - drawShare;

    }


    if(ag > hg && awayReds > 0){

      drawShare = remaining * 0.70;

      losingShare =
        remaining - drawShare;

    }


    if(hg > ag){

      home = leaderTarget;
      draw = drawShare;
      away = losingShare;

    }
    else{

      away = leaderTarget;
      draw = drawShare;
      home = losingShare;

    }

  }


  /*
  =====================================================
  DOS O MÁS GOLES DE DIFERENCIA MUY TARDE
  =====================================================
  */

  if(
    minute >= 85 &&
    Math.abs(goalDiff) >= 2
  ){

    const lead =
      Math.abs(goalDiff);


    if(minute >= 89 && lead >= 4){

      if(hg > ag){

        home = 100;
        draw = 0;
        away = 0;

      }
      else{

        away = 100;
        draw = 0;
        home = 0;

      }

    }

    else if(minute >= 89 && lead === 3){

      if(hg > ag){

        home = 99.6;
        draw = 0.25;
        away = 0.15;

      }
      else{

        away = 99.6;
        draw = 0.25;
        home = 0.15;

      }

    }

    else if(minute >= 89 && lead === 2){

      if(hg > ag){

        home = 99;
        draw = 0.7;
        away = 0.3;

      }
      else{

        away = 99;
        draw = 0.7;
        home = 0.3;

      }

    }

  }


  /*
  =====================================================
  NORMALIZACIÓN
  =====================================================
  */

  home = Math.max(0,home);
  draw = Math.max(0,draw);
  away = Math.max(0,away);


  /*
  SI ES FINAL
  */

  if(minute >= 90){

    if(hg > ag){

      return {
        home:100,
        draw:0,
        away:0
      };

    }

    if(ag > hg){

      return {
        home:0,
        draw:0,
        away:100
      };

    }

    return {
      home:0,
      draw:100,
      away:0
    };

  }


  /*
  =====================================================
  GARANTÍA DE ROJA
  =====================================================
  */

  if(homeReds > 0 && home < 1){

    home = 1;

  }

  if(awayReds > 0 && away < 1){

    away = 1;

  }


  /*
  NORMALIZAMOS PARA QUE SUME 100
  */

  const total =
    home + draw + away;


  if(total <= 0){

    return {
      home:33,
      draw:34,
      away:33
    };

  }


  home = home / total * 100;
  draw = draw / total * 100;
  away = away / total * 100;


  /*
  SEGUNDA GARANTÍA:
  ROJA NO PUEDE QUEDAR EN 0
  */

  if(homeReds > 0 && home <= 0){

    home = 1;

    const rest =
      draw + away;

    draw =
      draw / rest * 99;

    away =
      away / rest * 99;

  }


  if(awayReds > 0 && away <= 0){

    away = 1;

    const rest =
      home + draw;

    home =
      home / rest * 99;

    draw =
      draw / rest * 99;

  }


  /*
  CORRECCIÓN FINAL DE SUMA
  */

  const finalTotal =
    home + draw + away;

  home =
    home / finalTotal * 100;

  draw =
    draw / finalTotal * 100;

  away =
    away / finalTotal * 100;


  return {
    home,
    draw,
    away
  };

}


/* =====================================================
   MOSTRAR PROBABILIDADES
===================================================== */

function updateProbabilities(){

  const probabilities =
    calculateProbabilities();


  document.getElementById(
    "homeProbability"
  ).textContent =
    Math.round(probabilities.home) + "%";


  document.getElementById(
    "drawProbability"
  ).textContent =
    Math.round(probabilities.draw) + "%";


  document.getElementById(
    "awayProbability"
  ).textContent =
    Math.round(probabilities.away) + "%";

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  document.getElementById("minute").textContent =
    match.minute;


  document.getElementById("homeGoals").textContent =
    match.home.goals;

  document.getElementById("awayGoals").textContent =
    match.away.goals;


  document.getElementById("homeArrivals").textContent =
    match.home.arrivals;

  document.getElementById("awayArrivals").textContent =
    match.away.arrivals;


  document.getElementById("homeShots").textContent =
    match.home.shots;

  document.getElementById("awayShots").textContent =
    match.away.shots;


  document.getElementById("homeTarget").textContent =
    match.home.target;

  document.getElementById("awayTarget").textContent =
    match.away.target;


  document.getElementById("homeGoalsStat").textContent =
    match.home.goals;

  document.getElementById("awayGoalsStat").textContent =
    match.away.goals;


  document.getElementById("homeCorners").textContent =
    match.home.corners;

  document.getElementById("awayCorners").textContent =
    match.away.corners;


  document.getElementById("homeYellows").textContent =
    match.home.yellows;

  document.getElementById("awayYellows").textContent =
    match.away.yellows;


  document.getElementById("homeReds").textContent =
    match.home.reds;

  document.getElementById("awayReds").textContent =
    match.away.reds;


  document.getElementById("homeFouls").textContent =
    match.home.fouls;

  document.getElementById("awayFouls").textContent =
    match.away.fouls;


  updateProbabilities();


  document.getElementById("message").textContent =
    match.minute +
    "' · River " +
    match.home.goals +
    "-" +
    match.away.goals +
    " Boca";

}


/* =====================================================
   INICIO
===================================================== */

render();

</script>
