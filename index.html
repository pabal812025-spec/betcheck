<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#071426;
  color:#fff;
}

header{
  padding:18px 16px;
  background:#0b1d35;
  border-bottom:1px solid #1b3555;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#42d9ff;
}

.subtitle{
  color:#8fa7c2;
  font-size:13px;
  margin-top:4px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.search{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #294866;
  background:#0c2039;
  color:#fff;
  font-size:15px;
  outline:none;
}

.days{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin:15px 0;
}

.day{
  min-width:82px;
  padding:10px 7px;
  border-radius:10px;
  background:#0c2039;
  border:1px solid #294866;
  text-align:center;
  cursor:pointer;
  color:#b7c8da;
}

.day.active{
  background:#123e65;
  border-color:#42d9ff;
  color:#fff;
}

.section-title{
  margin:20px 0 10px;
  font-size:18px;
}

.card{
  background:#0c1f36;
  border:1px solid #1c3857;
  border-radius:14px;
  padding:15px;
  margin-bottom:11px;
}

.match-card{
  cursor:pointer;
}

.match-top{
  display:flex;
  justify-content:space-between;
  color:#8fa7c2;
  font-size:12px;
  margin-bottom:10px;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:16px;
  font-weight:bold;
}

.score{
  font-size:22px;
}

.status{
  color:#42d9ff;
  font-size:12px;
  margin-top:8px;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#123e65;
  color:white;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.back{
  margin-bottom:14px;
}

.detail-title{
  text-align:center;
  font-size:22px;
  margin:8px 0;
}

.detail-score{
  text-align:center;
  font-size:35px;
  font-weight:bold;
  margin:8px 0;
}

.minute{
  text-align:center;
  color:#42d9ff;
  font-size:14px;
}

.probs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}

.prob{
  background:#102943;
  border-radius:12px;
  padding:13px 6px;
  text-align:center;
}

.prob-number{
  font-size:25px;
  font-weight:bold;
}

.home{
  color:#50d890;
}

.draw{
  color:#ffd45a;
}

.away{
  color:#ff8a8a;
}

.label{
  color:#9db1c6;
  font-size:12px;
  margin-top:4px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.control-group{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.control-title{
  grid-column:1/-1;
  color:#8fa7c2;
  font-size:12px;
  margin-top:5px;
}

.control-group button{
  width:100%;
}

.reset{
  width:100%;
  margin-top:4px;
  background:#26384d;
}

.small-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#102943;
  padding:12px;
  border-radius:10px;
}

.stat-name{
  color:#91a8bf;
  font-size:12px;
}

.stat-value{
  margin-top:5px;
  font-size:18px;
  font-weight:bold;
}

.notice{
  padding:12px;
  background:#102943;
  border-radius:10px;
  color:#b9c9d9;
  font-size:13px;
  line-height:1.4;
  margin-top:12px;
}

.hidden{
  display:none;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:12px;
}

.tab{
  white-space:nowrap;
  padding:8px 11px;
  background:#102943;
  border-radius:8px;
  color:#9fb2c7;
  font-size:12px;
}

</head>

/* =====================================================

===================================================== */

/* =====================================================
   HOME
===================================================== */

function selectDay(day){

  selectedDay = day;

  document.querySelectorAll(".day").forEach((el,i)=>{
    el.classList.toggle("active",i===day);
  });

  renderMatches();

}


function renderMatches(){

  const container =
    document.getElementById("matches");

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  let matches =
    matchesByDay[selectedDay] || [];

  if(search){

    matches =
      matches.filter(m =>
        (
          m.home+" "+
          m.away+" "+
          m.competition
        )
        .toLowerCase()
        .includes(search)
      );

  }


  if(!matches.length){

    container.innerHTML = `
      <div class="card">
        No se encontraron partidos.
      </div>
    `;

    return;
  }


  let html = "";

  matches.forEach((m,index)=>{

    html += `

      <div
        class="card match-card"
        onclick="openMatch('${m.id}')"
      >

        <div class="match-top">
          <span>${m.competition}</span>
          <span>${m.time}</span>
        </div>

        <div class="teams">
          <span>${m.home}</span>
          <span class="score">${m.score}</span>
          <span>${m.away}</span>
        </div>

        ${
          index===0
          ?
          `<div class="status">
             🧠 Análisis MatchIA
           </div>`
          :
          ""
        }

      </div>

    `;

  });


  container.innerHTML = html;

}


function searchMatches(){

  renderMatches();

}


/* =====================================================
   ABRIR PARTIDO
===================================================== */

function openMatch(id){

  currentMatch = id;

  const match = findMatch(id);

  if(!match) return;


  /*
    DEMO PRINCIPAL RIVER - BOCA

    Arranca exactamente con:
    40'
    0-0
    10-3 llegadas
    4-2 tiros al arco
    0-0 rojas
  */

  if(id==="river-boca"){

    matchState = {

      minute:40,

      homeScore:0,
      awayScore:0,

      homeChances:10,
      awayChances:3,

      homeTarget:4,
      awayTarget:2,

      homeReds:0,
      awayReds:0

    };

  }
  else{

    matchState = {

      minute:40,

      homeScore:0,
      awayScore:0,

      homeChances:8,
      awayChances:6,

      homeTarget:3,
      awayTarget:3,

      homeReds:0,
      awayReds:0

    };

  }


  document
    .getElementById("homeView")
    .classList.add("hidden");

  document
    .getElementById("detailView")
    .classList.remove("hidden");


  renderDetail();

}


function findMatch(id){

  for(const day of matchesByDay){

    const match =
      day.find(m=>m.id===id);

    if(match) return match;

  }

  return null;

}


function goHome(){

  document
    .getElementById("detailView")
    .classList.add("hidden");

  document
    .getElementById("homeView")
    .classList.remove("hidden");

  renderMatches();

}


/* =====================================================
   MOTOR DE PROBABILIDADES
===================================================== */

function calculateProbabilities(){

  const s = matchState;


  /*
    FINAL
  */

  if(s.minute>=90){

    if(s.homeScore>s.awayScore){

      return {
        home:100,
        draw:0,
        away:0
      };

    }

    if(s.awayScore>s.homeScore){

      return {
        home:0,
        draw:0,
        away:100
      };

    }

    return {
      home:0,
      draw:100,
      away:0
    };

  }


  /*
    BASE
  */

  let home = 42;
  let draw = 34;
  let away = 24;


  /*
    LLEGADAS

    Las llegadas influyen,
    pero de forma moderada.
  */

  const chanceDiff =
    s.homeChances - s.awayChances;

  home += chanceDiff * 0.45;
  away -= chanceDiff * 0.45;


  /*
    TIROS AL ARCO

    Tienen más peso que las llegadas.
  */

  const targetDiff =
    s.homeTarget - s.awayTarget;

  home += targetDiff * 1.90;
  away -= targetDiff * 1.90;


  /*
    PESO DEL MARCADOR
  */

  let scoreWeight;

  if(s.minute<15){

    scoreWeight=0.35;

  }
  else if(s.minute<25){

    scoreWeight=0.60;

  }
  else if(s.minute<35){

    scoreWeight=0.90;

  }
  else if(s.minute<45){

    scoreWeight=1.25;

  }
  else if(s.minute<55){

    scoreWeight=1.55;

  }
  else if(s.minute<65){

    scoreWeight=1.85;

  }
  else if(s.minute<75){

    scoreWeight=2.05;

  }
  else if(s.minute<82){

    scoreWeight=2.25;

  }
  else if(s.minute<87){

    scoreWeight=2.80;

  }
  else{

    scoreWeight=3.40;

  }


  /*
    MARCADOR

    Importante:
    si hay empate, NO damos
    ventaja artificial a ningún equipo.
  */

  const scoreDiff =
    s.homeScore - s.awayScore;


  if(scoreDiff>0){

    home +=
      scoreDiff *
      15 *
      scoreWeight;

    away -=
      scoreDiff *
      11 *
      scoreWeight;

  }
  else if(scoreDiff<0){

    away +=
      Math.abs(scoreDiff) *
      15 *
      scoreWeight;

    home -=
      Math.abs(scoreDiff) *
      11 *
      scoreWeight;

  }
  else{

    /*
      Refuerzo del empate según
      el tiempo restante.
    */

    if(s.minute<30){

      draw += 4;

    }
    else if(s.minute<60){

      draw += 6;

    }
    else if(s.minute<70){

      draw += 8;

    }
    else if(s.minute<80){

      draw += 10;

    }
    else if(s.minute<87){

      draw += 12;

    }
    else{

      draw += 16;

    }

  }


  /*
    PENALIZACIÓN TEMPORAL
    DEL EQUIPO QUE VA PERDIENDO

    Moderada para no aplastar
    sus posibilidades demasiado pronto.
  */

  if(scoreDiff<0){

    if(s.minute>55){

      home -=
        (s.minute-55) *
        0.10;

    }

    if(s.minute>70){

      home -=
        (s.minute-70) *
        0.16;

    }

  }


  if(scoreDiff>0){

    if(s.minute>55){

      away -=
        (s.minute-55) *
        0.10;

    }

    if(s.minute>70){

      away -=
        (s.minute-70) *
        0.16;

    }

  }


  /*
    ROJAS

    Se mantiene la lógica que
    veníamos utilizando.
  */

  const redPressure =
    (s.awayReds - s.homeReds) *
    14;

  home += redPressure;
  away -= redPressure;


  home -=
    s.homeReds *
    12 *
    scoreWeight;

  away +=
    s.homeReds *
    4 *
    scoreWeight;


  away -=
    s.awayReds *
    12 *
    scoreWeight;

  home +=
    s.awayReds *
    4 *
    scoreWeight;


  /*
    EVITAR NEGATIVOS
  */

  home = Math.max(0,home);
  draw = Math.max(0,draw);
  away = Math.max(0,away);


  /*
    NORMALIZAR A 100
  */

  const total =
    home +
    draw +
    away;


  home =
    Math.round(
      home /
      total *
      100
    );


  draw =
    Math.round(
      draw /
      total *
      100
    );


  away =
    100 -
    home -
    draw;


  return {
    home,
    draw,
    away
  };

}

/* =====================================================
   ESTADÍSTICAS
===================================================== */

function getStats(){

  return {

    minute:
      matchState.minute,

    homeChances:
      matchState.homeChances,

    awayChances:
      matchState.awayChances,

    homeTarget:
      matchState.homeTarget,

    awayTarget:
      matchState.awayTarget,

    homeReds:
      matchState.homeReds,

    awayReds:
      matchState.awayReds

  };

}


/* =====================================================
   EXPLICACIÓN
===================================================== */

function buildExplanation(p){

  const s =
    matchState;

  const match =
    findMatch(currentMatch);


  if(s.minute>=90){

    return "El partido terminó y el resultado final determina la distribución.";

  }


  if(s.homeScore===s.awayScore){

    if(
      p.draw >= p.home &&
      p.draw >= p.away
    ){

      return `
        El partido está empatado y el tiempo restante
        aumenta el peso del empate. Las llegadas y los
        tiros al arco siguen influyendo en las posibilidades
        de cada equipo.
      `;

    }

    return `
      El marcador está igualado, pero las estadísticas
      de juego generan diferencias entre ambos equipos.
    `;

  }


  if(s.homeScore>s.awayScore){

    return `
      ${match.home} está arriba en el marcador.
      Las llegadas y los tiros al arco mantienen su influencia
      sobre el análisis.
    `;

  }


  return `
    ${match.away} está arriba en el marcador.
    Las llegadas y los tiros al arco del equipo que pierde
    siguen siendo considerados.
  `;

}


/* =====================================================
   CAMBIAR MARCADOR
   SOLO MARCADOR
===================================================== */

function changeScore(team,amount){

  if(team==="home"){

    matchState.homeScore =
      Math.max(
        0,
        matchState.homeScore + amount
      );

  }


  if(team==="away"){

    matchState.awayScore =
      Math.max(
        0,
        matchState.awayScore + amount
      );

  }


  renderDetail();

}


/* =====================================================

   SOLO MINUTO
===================================================== */

function changeMinute(amount){

  matchState.minute =
    Math.max(
      1,
      Math.min(
        90,
        matchState.minute + amount

  renderDetail();

}
