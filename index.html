<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}

.app{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:#0b1728;
  padding:18px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#35e0a1;
}

.header-icons{
  display:flex;
  gap:10px;
}

.icon{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#14243a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.match-card{
  background:#102039;
  border:1px solid #1d3553;
  border-radius:18px;
  padding:18px;
}

.match-title{
  text-align:center;
  color:#8fa7c4;
  font-size:13px;
  margin-bottom:18px;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}

.team{
  text-align:center;
}

.team-name{
  font-size:19px;
  font-weight:700;
}

.score{
  font-size:30px;
  font-weight:800;
  white-space:nowrap;
}

.minute-control{
  margin-top:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.minute-control span{
  min-width:70px;
  text-align:center;
  font-weight:700;
  color:#d9e6f5;
}

button{
  border:0;
  cursor:pointer;
}

.small-btn{
  width:30px;
  height:30px;
  border-radius:8px;
  background:#1b304b;
  color:#fff;
  font-size:18px;
  font-weight:700;
}

.probabilities{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:20px;
}

.prob{
  background:#0b1728;
  border-radius:12px;
  padding:12px 5px;
  text-align:center;
}

.prob-value{
  font-size:20px;
  font-weight:800;
}

.prob-label{
  margin-top:4px;
  color:#91a7c0;
  font-size:12px;
}

.section{
  margin-top:18px;
  background:#102039;
  border:1px solid #1d3553;
  border-radius:18px;
  padding:16px;
}

.section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:12px;
}

.stat-row{
  display:grid;
  grid-template-columns:1fr 105px 1fr;
  align-items:center;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #1a304b;
}

.stat-row:last-child{
  border-bottom:0;
}

.stat-name{
  text-align:center;
  font-size:13px;
  color:#b7c8da;
  line-height:1.2;
}

.stat-side{
  display:flex;
  align-items:center;
  gap:7px;
}

.stat-side.right{
  justify-content:flex-end;
}

.stat-number{
  min-width:22px;
  text-align:center;
  font-size:16px;
  font-weight:700;
}

.analysis{
  margin-top:18px;
  background:#102039;
  border:1px solid #1d3553;
  border-radius:18px;
  padding:16px;
}

.analysis-title{
  color:#35e0a1;
  font-weight:800;
  margin-bottom:8px;
}

.analysis-text{
  color:#c7d5e4;
  font-size:14px;
  line-height:1.45;
}
</style>
</head>

<body>

        <div class="prob-label">
          Boca
        </div>

      </div>

    </div>

  </div>
