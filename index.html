<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>BetCheck</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    header {
      background: #111827;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #263244;
    }

    header h1 {
      margin: 0;
      color: #22c55e;
      font-size: 30px;
    }

    header p {
      margin: 7px 0 0;
      color: #9ca3af;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .barra {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .azul {
      background: #2563eb;
      color: white;
    }

    .gris {
      background: #374151;
      color: white;
    }

    .estado {
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .partido {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .liga {
      color: #60a5fa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .pais {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .equipos {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .acciones {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .oculto {
      display: none;
    }

    .detalle {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 12px;
      padding: 18px;
    }

    .detalle h2 {
      color: #22c55e;
    }

    .dato {
      padding: 10px 0;
      border-bottom: 1px solid #263244;
      color: #d1d5db;
    }

    .dato strong {
      color: white;
    }

    .marcador {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 20px 0;
    }

    .tituloStats {
      margin-top: 25px;
      margin-bottom: 10px;
      color: #22c55e;
      font-size: 20px;
      font-weight: bold;
    }

    .nombreEquipos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 13px;
    }

    .estadisticas {
      background: #0b1220;
      border: 1px solid #263244;
      border-radius: 10px;
      overflow: hidden;
    }

    .stat {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      align-items: center;
      padding: 11px 10px;
      border-bottom: 1px solid #263244;
      text-align: center;
    }

    .stat:last-child {
      border-bottom: 0;
    }

    .stat .valor {
      font-weight: bold;
      color: white;
    }

    .stat .nombre {
      color: #9ca3af;
      font-size: 13px;
    }

    .cargando {
      color: #60a5fa;
      text-align: center;
      padding: 15px;
    }

    @media (max-width: 600px) {
      .barra {
        flex-direction: column;
      }

      .stat {
        grid-template-columns: 1fr 1.2fr 1fr;
        font-size: 14px;
      }
    }
  </style></head><body><header>
  <h1>⚽ BetCheck</h1>
  <p>Análisis estadístico de partidos</p>
</header><div class="container">  <div id="listaVista"><div class="barra">

  <input
    id="buscador"
    type="text"
    placeholder="Buscar equipo, liga o país..."
    oninput="filtrar()"
  >

  <button class="azul" onclick="cargar()">
    🔄 Actualizar
  </button>

</div>

<div id="estado" class="estado">
  Cargando partidos...
</div>

<div id="lista"></div>

  </div>  <div id="detalleVista" class="oculto"></div></div><script>

  let partidos = [];


  function escapeHTML(texto) {

    if (texto === null || texto === undefined) {
      return "";
    }

    return String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function valor(valor) {

    if (
      valor === null ||
      valor === undefined ||
      valor === ""
    ) {
      return "—";
    }

    return escapeHTML(valor);

  }


  async function cargar() {

    const estado = document.getElementById("estado");

    estado.textContent = "Cargando partidos...";

    try {

      const respuesta = await fetch(
        "/api/fixtures?nocache=" + Date.now()
      );

      if (!respuesta.ok) {
        throw new Error("Error " + respuesta.status);
      }

      partidos = await respuesta.json();

      estado.textContent =
        "Se encontraron " + partidos.length + " partidos.";

      mostrar(partidos);

    } catch (error) {

      console.error(error);

      estado.textContent =
        "No se pudieron cargar los partidos.";

    }

  }


  function mostrar(listaPartidos) {

    const lista = document.getElementById("lista");

    if (!listaPartidos.length) {

      lista.innerHTML =
        "<p>No se encontraron partidos.</p>";

      return;

    }

    lista.innerHTML = listaPartidos.map(partido => `

      <div class="partido">

        <div class="liga">
          🏆 ${escapeHTML(partido.league)}
        </div>

        <div class="pais">
          🌎 ${escapeHTML(partido.country)}
        </div>

        <div class="equipos">
          ${escapeHTML(partido.home)}
          <br>
          <span style="color:#9ca3af;">VS</span>
          <br>
          ${escapeHTML(partido.away)}
        </div>

        <div class="acciones">

          <button
            class="azul"
            onclick="abrirPartido(${Number(partido.id)})"
          >
            📊 Ver partido
          </button>

        </div>

      </div>

    `).join("");

  }


  function filtrar() {

    const texto =
      document
        .getElementById("buscador")
        .value
        .toLowerCase()
        .trim();

    if (!texto) {

      mostrar(partidos);

      return;

    }

    const filtrados = partidos.filter(partido => {

      const contenido = [

        partido.home,
        partido.away,
        partido.league,
        partido.country

      ].join(" ").toLowerCase();

      return contenido.includes(texto);

    });

    mostrar(filtrados);

  }


  async function abrirPartido(id) {

    document
      .getElementById("listaVista")
      .classList.add("oculto");

    const detalle =
      document.getElementById("detalleVista");

    detalle.classList.remove("oculto");

    detalle.innerHTML = `
      <div class="detalle">
        <p>⏳ Cargando partido...</p>
      </div>
    `;

    try {

      // Primero obtenemos los datos principales
      const respuestaPartido = await fetch(
        "/api/match?id=" +
        encodeURIComponent(id) +
        "&nocache=" +
        Date.now()
      );

      if (!respuestaPartido.ok) {
        throw new Error("No se pudo cargar el partido");
      }

      const partido = await respuestaPartido.json();


      // Después obtenemos las estadísticas directamente
      const respuestaStats = await fetch(
        "/api/api/stats?id=" +
        encodeURIComponent(id) +
        "&nocache=" +
        Date.now()
      );


      let estadisticas = [];

      if (respuestaStats.ok) {

        const datosStats =
          await respuestaStats.json();

        estadisticas = Array.isArray(datosStats)
          ? datosStats
          : [];

      }


      console.log("Partido:", partido);

      console.log(
        "Estadísticas:",
        estadisticas
      );


      mostrarDetalle(
        partido,
        estadisticas
      );


    } catch (error) {

      console.error(error);

      detalle.innerHTML = `
        <div class="detalle">

          <p>No se pudo cargar el partido.</p>

          <button
            class="gris"
            onclick="volver()"
          >
            ← Volver
          </button>

        </div>
      `;

    }

  }


  function buscarStat(equipo, nombre) {

    if (
      !equipo ||
      !Array.isArray(equipo.estadisticas)
    ) {
      return "—";
    }

    const stat =
      equipo.estadisticas.find(
        item => item.tipo === nombre
      );

    if (!stat) {
      return "—";
    }

    return valor(stat.valor);

  }


  function mostrarDetalle(
    partido,
    estadisticas
  ) {

    const detalle =
      document.getElementById("detalleVista");

    let estado =
      partido.estado || "No disponible";


    if (estado === "FT") {
      estado = "Finalizado";
    }

    if (estado === "NS") {
      estado = "No iniciado";
    }

    if (estado === "HT") {
      estado = "Entretiempo";
    }

    if (
      estado === "1H" ||
      estado === "2H"
    ) {

      estado =
        "🔴 EN VIVO · " +
        (partido.minuto ?? "?") +
        "'";

    }


    const fecha = partido.fecha
      ? new Date(partido.fecha)
          .toLocaleString("es-AR")
      : "No disponible";


    const local =
      estadisticas.find(
        equipo =>
          equipo.equipo?.id ===
          partido.local?.id
      );


    const visitante =
      estadisticas.find(
        equipo =>
          equipo.equipo?.id ===
          partido.visitante?.id
      );


    const localNombre =
      partido.local?.nombre ||
      "Local";


    const visitanteNombre =
      partido.visitante?.nombre ||
      "Visitante";


    detalle.innerHTML = `

      <div class="detalle">

        <button
          class="gris"
          onclick="volver()"
        >
          ← Volver a partidos
        </button>


        <h2>

          ${escapeHTML(localNombre)}

          vs

          ${escapeHTML(visitanteNombre)}

        </h2>


        <div class="marcador">

          ${partido.marcador?.local ?? 0}

          -

          ${partido.marcador?.visitante ?? 0}

        </div>


        <div class="dato">

          🏆 Liga:

          <strong>

            ${escapeHTML(
              partido.liga?.nombre ||
              "No disponible"
            )}

          </strong>

        </div>


        <div class="dato">

          🌎 País:

          <strong>

            ${escapeHTML(
              partido.liga?.pais ||
              "No disponible"
            )}

          </strong>

        </div>


        <div class="dato">

          📅 Fecha:

          <strong>

            ${escapeHTML(fecha)}

          </strong>

        </div>


        <div class="dato">

          📌 Estado:

          <strong>

            ${escapeHTML(estado)}

          </strong>

        </div>


        <div class="dato">

          🏟️ Estadio:

          <strong>

            ${escapeHTML(
              partido.estadio ||
              "No informado"
            )}

          </strong>

        </div>


        <div class="dato">

          🧑‍⚖️ Árbitro:

          <strong>

            ${escapeHTML(
              partido.arbitro ||
              "No informado"
            )}

          </strong>

        </div>


        <div class="tituloStats">

          📊 Estadísticas

        </div>


        <div class="nombreEquipos">

          <strong>
            ${escapeHTML(localNombre)}
          </strong>

          <span>
            ESTADÍSTICA
          </span>

          <strong>
            ${escapeHTML(visitanteNombre)}
          </strong>

        </div>


        <div class="estadisticas">


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Total Shots"
              )}

            </div>

            <div class="nombre">
              🎯 Tiros totales
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Total Shots"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Shots on Goal"
              )}

            </div>

            <div class="nombre">
              🥅 Tiros al arco
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Shots on Goal"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Corner Kicks"
              )}

            </div>

            <div class="nombre">
              🚩 Córners
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Corner Kicks"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Ball Possession"
              )}

            </div>

            <div class="nombre">
              🟢 Posesión
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Ball Possession"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Passes accurate"
              )}

            </div>

            <div class="nombre">
              🔄 Pases precisos
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Passes accurate"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Fouls"
              )}

            </div>

            <div class="nombre">
              ⚠️ Faltas
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Fouls"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Yellow Cards"
              )}

            </div>

            <div class="nombre">
              🟨 Amarillas
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Yellow Cards"
              )}

            </div>

          </div>


          <div class="stat">

            <div class="valor">

              ${buscarStat(
                local,
                "Red Cards"
              )}

            </div>

            <div class="nombre">
              🟥 Rojas
            </div>

            <div class="valor">

              ${buscarStat(
                visitante,
                "Red Cards"
              )}

            </div>

          </div>


        </div>

      </div>

    `;

  }


  function volver() {

    document
      .getElementById("detalleVista")
      .classList.add("oculto");

    document
      .getElementById("listaVista")
      .classList.remove("oculto");

    window.scrollTo(0, 0);

  }


  cargar();

</script></body>
</html>
