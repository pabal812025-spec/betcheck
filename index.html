<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchIA</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial;color:#17202a}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{background:#111827;color:#fff;text-align:center;padding:18px}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0;font-size:13px;opacity:.75}
.match{padding:18px}
.competition{text-align:center;color:#667085;font-size:14px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;text-align:center}
.team{font-weight:bold;font-size:18px}
.score{font-size:34px;font-weight:bold}
.minute{margin-top:5px;color:#667085;font-size:14px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
button{border:0;border-radius:10px;padding:11px 5px;background:#e8edf3;cursor:pointer;font-size:13px}
.primary{background:#111827;color:white}
.probabilities{margin-top:24px}
.prob-title{font-size:14px;font-weight:bold;margin-bottom:10px}
.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prob{padding:14px 6px;border-radius:12px;background:#f1f5f9;text-align:center}
.prob strong{display:block;font-size:26px}
.prob span{font-size:12px;color:#667085}
.why{margin-top:20px;background:#f8fafc;border-radius:12px;padding:15px}
.why h3{margin:0 0 8px;font-size:16px}
.why p{margin:0;line-height:1.5;color:#475467;font-size:14px}
.stats{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:15px}
.stats h3{font-size:16px;margin-bottom:12px}
.stat-row{display:grid;grid-template-columns:1fr 90px 1fr;margin:8px 0;align-items:center;font-size:14px}
.stat-row div:nth-child(2){text-align:center;color:#667085;font-size:12px}
.stat-row div:last-child{text-align:right}
.reset{margin-top:20px;width:100%;background:#fee2e2;color:#991b1b}
</style>
</head>

<body>

<div class="app">

<header>
<h1>MatchIA</h1>
<p>Análisis estadístico en vivo</p>
</header>

<main class="match">

<div class="competition">🇦🇷 Argentina · Superclásico</div>

<div class="teams">
<div class="team">River Plate</div>

<div>
<div class="score">
<span id="homeScore">0</span> -
<span id="awayScore">0</span>
</div>
<div class="minute"><span id="minute">0</span>'</div>
</div>

<div class="team">Boca Juniors</div>
</div>

<div class="controls">

<button class="primary" onclick="startMatch()">▶ Iniciar</button>
<button onclick="addMinute()">+1 minuto</button>
<button onclick="homeGoal()">⚽ Gol River</button>

<button onclick="awayGoal()">⚽ Gol Boca</button>
<button onclick="homeRed()">🟥 Roja River</button>
<button onclick="awayRed()">🟥 Roja Boca</button>

<button onclick="addHomeChance()">📈 Llegada River</button>
<button onclick="addAwayChance()">📈 Llegada Boca</button>
<button onclick="resetMatch()">↻ Reiniciar</button>

</div>

<section class="probabilities">

<div class="prob-title">Probabilidad estimada</div>

<div class="prob-grid">

<div class="prob">
<strong id="homeProb">55%</strong>
<span>River</span>
</div>

<div class="prob">
<strong id="drawProb">30%</strong>
<span>Empate</span>
</div>

<div class="prob">
<strong id="awayProb">15%</strong>
<span>Boca</span>
</div>

</div>
</section>

<section class="why">

<h3>🧠 ¿Por qué?</h3>
<p id="explanation"></p>

</section>

<section class="stats">

<h3>📊 Estadísticas</h3>

<div class="stat-row">
<div id="homePoss">51%</div>
<div>Posesión</div>
<div id="awayPoss">49%</div>
</div>

<div class="stat-row">
<div id="homeShots">0</div>
<div>Tiros</div>
<div id="awayShots">0</div>
</div>

<div class="stat-row">
<div id="homeTarget">0</div>
<div>Tiros al arco</div>
<div id="awayTarget">0</div>
</div>

<div class="stat-row">
<div id="homeChances">0</div>
<div>Llegadas</div>
<div id="awayChances">0</div>
</div>

<div class="stat-row">
<div id="homeCorners">0</div>
<div>Córners</div>
<div id="awayCorners">0</div>
</div>

<div class="stat-row">
<div id="homeReds">0</div>
<div>Rojas</div>
<div id="awayReds">0</div>
</div>

<div class="stat-row">
<div></div>
<div>Restante</div>
<div id="remaining">90 min</div>
</div>

</section>

</main>
</div>

<script>

let minute=0;

let homeScore=0;
let awayScore=0;

let homeShots=0;
let awayShots=0;

let homeTarget=0;
let awayTarget=0;

let homeChances=0;
let awayChances=0;

let homeCorners=0;
let awayCorners=0;

let homeReds=0;
let awayReds=0;

let homePoss=51;
let awayPoss=49;


/* Fuerza previa */

const homeStrength=78;
const awayStrength=72;
const homeAdvantage=2;


/* --------------------------------
   BASE PREPARTIDO
-------------------------------- */

function preMatch(){

let h=homeStrength+homeAdvantage;
let a=awayStrength;

let total=h+a;

let home=(h/total)*70;
let away=(a/total)*70;
let draw=30;

return normalize(home,draw,away);

}


/* --------------------------------
   PRESIÓN EN VIVO
-------------------------------- */

function livePressure(){

let chances =
(homeChances-awayChances)*0.65;

let shots =
(homeShots-awayShots)*0.25;

let target =
(homeTarget-awayTarget)*1.10;

let corners =
(homeCorners-awayCorners)*0.25;

let possession =
(homePoss-awayPoss)*0.06;


/*
 Roja Boca favorece a River.
 Roja River favorece a Boca.

 Cada roja suma 14 puntos de presión.
*/

let redPressure =
(awayReds-homeReds)*14;


return chances
     + shots
     + target
     + corners
     + possession
     + redPressure;

}


/* --------------------------------
   PROBABILIDADES
-------------------------------- */

function probabilities(){

if(minute>=90){

if(homeScore>awayScore)
return {home:100,draw:0,away:0};

if(awayScore>homeScore)
return {home:0,draw:0,away:100};

return {home:0,draw:100,away:0};

}

let base=preMatch();

let time=minute/90;

let pressure=livePressure();


/* ================================
   0-0
================================ */

if(homeScore===0 && awayScore===0){

let draw=30+time*34;

let effect=
pressure*(0.25+time*0.50);

draw-=Math.abs(effect)*0.18;

let home=
base.home*(1-time*0.42);

let away=
base.away*(1-time*0.42);

home+=effect;
away-=effect;

home=Math.max(home,8);
away=Math.max(away,8);
draw=Math.max(draw,20);

return normalize(home,draw,away);

}


/* ================================
   CON GOLES
================================ */

let difference=homeScore-awayScore;

let scoreWeight=
0.35+time*1.30;


/*
 El efecto de la presión
 ahora entra directamente.
*/

let effect=
pressure*(0.20+time*0.65);


/* ================================
   RIVER VA GANANDO
================================ */

if(difference>0){

let home=
base.home+
difference*17*scoreWeight+
effect;

let draw=
base.draw-
time*7;

let away=
base.away-
difference*9*scoreWeight-
effect;


/*
 Las rojas afectan nuevamente
 y de forma explícita.
*/

home-=homeReds*12*scoreWeight;
away+=homeReds*4*scoreWeight;

away-=awayReds*12*scoreWeight;
home+=awayReds*4*scoreWeight;


/*
 Nunca desaparecen completamente
 las posibilidades.
*/

if(minute<30){

away=Math.max(away,10);
draw=Math.max(draw,18);

}else if(minute<60){

away=Math.max(away,6);
draw=Math.max(draw,12);

}else{

away=Math.max(away,3);
draw=Math.max(draw,7);

}

return normalize(home,draw,away);

}


/* ================================
   BOCA VA GANANDO
================================ */

if(difference<0){

let lead=Math.abs(difference);

let away=
base.away+
lead*17*scoreWeight-
effect;

let draw=
base.draw-
time*7;

let home=
base.home-
lead*9*scoreWeight+
effect;


/*
 Las rojas afectan explícitamente.
*/

away-=awayReds*12*scoreWeight;
home+=awayReds*4*scoreWeight;

home-=homeReds*12*scoreWeight;
away+=homeReds*4*scoreWeight;


if(minute<30){

home=Math.max(home,10);
draw=Math.max(draw,18);

}else if(minute<60){

home=Math.max(home,6);
draw=Math.max(draw,12);

}else{

home=Math.max(home,3);
draw=Math.max(draw,7);

}

return normalize(home,draw,away);

}

return base;

}


/* --------------------------------
   NORMALIZAR
-------------------------------- */

function normalize(home,draw,away){

home=Math.max(0,home);
draw=Math.max(0,draw);
away=Math.max(0,away);

let total=home+draw+away;

return{
home:home/total*100,
draw:draw/total*100,
away:away/total*100
};

}


/* --------------------------------
   ACTUALIZAR
-------------------------------- */

function update(){

document.getElementById("homeScore").textContent=homeScore;
document.getElementById("awayScore").textContent=awayScore;

document.getElementById("minute").textContent=minute;

document.getElementById("homePoss").textContent=homePoss+"%";
document.getElementById("awayPoss").textContent=awayPoss+"%";

document.getElementById("homeShots").textContent=homeShots;
document.getElementById("awayShots").textContent=awayShots;

document.getElementById("homeTarget").textContent=homeTarget;
document.getElementById("awayTarget").textContent=awayTarget;

document.getElementById("homeChances").textContent=homeChances;
document.getElementById("awayChances").textContent=awayChances;

document.getElementById("homeCorners").textContent=homeCorners;
document.getElementById("awayCorners").textContent=awayCorners;

document.getElementById("homeReds").textContent=homeReds;
document.getElementById("awayReds").textContent=awayReds;

document.getElementById("remaining").textContent=
Math.max(0,90-minute)+" min";

let p=probabilities();

document.getElementById("homeProb").textContent=
Math.round(p.home)+"%";

document.getElementById("drawProb").textContent=
Math.round(p.draw)+"%";

document.getElementById("awayProb").textContent=
Math.round(p.away)+"%";

explain();

}


/* --------------------------------
   EXPLICACIÓN
-------------------------------- */

function explain(){

let text="";

if(minute===0){

text="Antes del partido, la estimación parte de la fuerza relativa de los equipos y una pequeña ventaja de localía.";

}else if(homeScore===0 && awayScore===0){

if(homeReds>0){

text="River tiene "+homeReds+" expulsión(es), por lo que su probabilidad disminuye.";

}else if(awayReds>0){

text="Boca tiene "+awayReds+" expulsión(es), por lo que su probabilidad disminuye.";

}else if(homeChances-awayChances>=6){

text="River genera muchas más llegadas. El empate gana peso con el paso del tiempo, pero el rendimiento de River sostiene su probabilidad.";

}else if(awayChances-homeChances>=6){

text="Boca genera muchas más llegadas. El empate gana peso con el paso del tiempo, pero el rendimiento de Boca sostiene su probabilidad.";

}else{

text="El partido sigue 0-0. El empate gana peso progresivamente y las diferencias de rendimiento todavía son moderadas.";

}

}else if(homeScore>awayScore){

text="River está arriba en el marcador. Boca conserva posibilidades porque todavía queda tiempo.";

}else{

text="Boca está arriba en el marcador. River conserva posibilidades porque todavía queda tiempo.";

}

if(homeReds>0){

text+=" River tiene "+homeReds+" expulsión(es).";

}

if(awayReds>0){

text+=" Boca tiene "+awayReds+" expulsión(es).";

}

document.getElementById("explanation").textContent=text;

}


/* --------------------------------
   CONTROLES
-------------------------------- */

function startMatch(){

if(minute===0){
minute=1;
update();
}

}


function addMinute(){

if(minute>=90)return;

minute++;
update();

}


function addHomeChance(){

if(minute>=90)return;

homeChances++;
homeShots++;

update();

}


function addAwayChance(){

if(minute>=90)return;

awayChances++;
awayShots++;

update();

}


function homeGoal(){

if(minute>=90)return;

homeScore++;
update();

}


function awayGoal(){

if(minute>=90)return;

awayScore++;
update();

}


function homeRed(){

if(minute>=90)return;

homeReds++;
update();

}


function awayRed(){

if(minute>=90)return;

awayReds++;
update();

}


function resetMatch(){

minute=0;

homeScore=0;
awayScore=0;

homeShots=0;
awayShots=0;

homeTarget=0;
awayTarget=0;

homeChances=0;
awayChances=0;

homeCorners=0;
awayCorners=0;

homeReds=0;
awayReds=0;

homePoss=51;
awayPoss=49;

update();

}


update();

</script>

</body>
</html>
