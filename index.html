<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetCheck</title>
</head>

<body>

  <h1>⚽ BetCheck</h1>

  <p id="estado">Probando conexión...</p>

  <div id="lista"></div>

  <script>
    fetch("/api/fixtures")
      .then(respuesta => respuesta.json())
      .then(partidos => {

        document.getElementById("estado").textContent =
          "Partidos encontrados: " + partidos.length;

        document.getElementById("lista").innerHTML =
          partidos.slice(0, 10).map(partido => `
            <p>
              <strong>${partido.home}</strong>
              vs
              <strong>${partido.away}</strong>
              — ${partido.league}
            </p>
          `).join("");

      })
      .catch(error => {

        document.getElementById("estado").textContent =
          "ERROR: " + error.message;

      });
  </script>

</body>
</html>
