<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchIA</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  padding:18px;
  background:#0b1728;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  color:#35e0a1;
  font-size:25px;
  font-weight:800;
}

.header-icons{
  display:flex;
  gap:10px;
}

.icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#14243a;
  display:flex;
  justify-content:center;
  align-items:center;
}

.match-card,
.stats-card{
  background:#102039;
  border:1px solid #1d3553;
  border-radius:18px;
  padding:18px;
}

.match-title{
  text-align:center;
  color:#8fa7c4;
  font-size:13px;
  margin-bottom:18px;
}

.live{
  color:#ff4d5d;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}

.team{
  text-align:center;
}

.team-name{
  font-size:19px;
  font-weight:700;
}

.score{
  font-size:30px;
  font-weight:800;
}

.minute{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:18px;
}

.minute-value{
  min-width:70px;
  text-align:center;
  font-size:18px;
  font-weight:800;
}

.btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#1b304b;
  color:#fff;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.btn:active{
  background:#29496b;
  transform:scale(.94);
}

.probabilities{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:20px;
}

.prob{
  background:#0b1728;
  border-radius:12px;
  padding:12px 4px;
  text-align:center;
}

.prob-value{
  font-size:20px;
  font-weight:800;
}

.prob-label{
  margin-top:4px;
  color:#91a7c0;
  font-size:12px;
}

.stats-card{
  margin-top:18px;
}

.section-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:14px;
}

.stat{
  display:grid;
  grid-template-columns:1fr 105px 1fr;
  align-items:center;
  min-height:52px;
  border-bottom:1px solid #1a304b;
}

.stat:last-child{
  border-bottom:0;
}

.side{
  display:flex;
  align-items:center;
  gap:6px;
}

.side.right{
  justify-content:flex-end;
}

.number{
  min-width:24px;
  text-align:center;
  font-size:16px;
  font-weight:bold;
}

.label{
  text-align:center;
  color:#b7c8da;
  font-size:12px;
}

.message{
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#102039;
  color:#b7c8da;
  font-size:14px;
  line-height:1.4;
}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      ⚽ MatchIA
    </div>

    <div class="header-icons">

      <div class="icon">
        🔔
      </div>

      <div class="icon">
        ⚙️
      </div>

    </div>

  </div>


  <div class="match-card">

    <div class="match-title">

      Demo · Partido en vivo

      <span class="live">
        ● EN VIVO
      </span>

    </div>


    <div class="teams">

      <div class="team">
        <div class="team-name">
          River
        </div>
      </div>


      <div class="score">

        <span id="homeGoals">
          0
        </span>

        -

        <span id="awayGoals">
          0
        </span>

      </div>


      <div class="team">
        <div class="team-name">
          Boca
        </div>
      </div>

    </div>


    <!-- MINUTOS -->

    <div class="minute">

      <button
        type="button"
        class="btn"
        onclick="changeMinute(-1)">
        −
      </button>

      <div class="minute-value">

        <span id="minute">
          0
        </span>'

      </div>

      <button
        type="button"
        class="btn"
        onclick="changeMinute(1)">
        +
      </button>

    </div>


    <!-- PROBABILIDADES -->

    <div class="probabilities">

      <div class="prob">

        <div
          class="prob-value"
          id="homeProbability">
          33%
        </div>

        <div class="prob-label">
          River
        </div>

      </div>


      <div class="prob">

        <div
          class="prob-value"
          id="drawProbability">
          34%
        </div>

        <div class="prob-label">
          Empate
        </div>

      </div>


      <div class="prob">

        <div
          class="prob-value"
          id="awayProbability">
          33%
        </div>

        <div class="prob-label">
          Boca
        </div>

      </div>

    </div>

  </div>


  <!-- ESTADÍSTICAS -->

  <div class="stats-card">

    <div class="section-title">
      Estadísticas
    </div>


    <!-- LLEGADAS -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','arrivals',-1)">
          −
        </button>

        <span
          class="number"
          id="homeArrivals">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','arrivals',1)">
          +
        </button>

      </div>


      <div class="label">
        🔥 Llegadas
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','arrivals',-1)">
          −
        </button>

        <span
          class="number"
          id="awayArrivals">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','arrivals',1)">
          +
        </button>

      </div>

    </div>


    <!-- TIROS -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','shots',-1)">
          −
        </button>

        <span
          class="number"
          id="homeShots">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','shots',1)">
          +
        </button>

      </div>


      <div class="label">
        🎯 Tiros
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','shots',-1)">
          −
        </button>

        <span
          class="number"
          id="awayShots">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','shots',1)">
          +
        </button>

      </div>

    </div>


    <!-- AL ARCO -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','target',-1)">
          −
        </button>

        <span
          class="number"
          id="homeTarget">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','target',1)">
          +
        </button>

      </div>


      <div class="label">
        🎯 Al arco
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','target',-1)">
          −
        </button>

        <span
          class="number"
          id="awayTarget">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','target',1)">
          +
        </button>

      </div>

    </div>


    <!-- GOLES -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','goals',-1)">
          −
        </button>

        <span
          class="number"
          id="homeGoalsStat">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','goals',1)">
          +
        </button>

      </div>


      <div class="label">
        ⚽ Goles
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','goals',-1)">
          −
        </button>

        <span
          class="number"
          id="awayGoalsStat">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','goals',1)">
          +
        </button>

      </div>

    </div>


    <!-- CÓRNERS -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','corners',-1)">
          −
        </button>

        <span
          class="number"
          id="homeCorners">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','corners',1)">
          +
        </button>

      </div>


      <div class="label">
        🚩 Córners
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','corners',-1)">
          −
        </button>

        <span
          class="number"
          id="awayCorners">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','corners',1)">
          +
        </button>

      </div>

    </div>


    <!-- AMARILLAS -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','yellows',-1)">
          −
        </button>

        <span
          class="number"
          id="homeYellows">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','yellows',1)">
          +
        </button>

      </div>


      <div class="label">
        🟨 Amarillas
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','yellows',-1)">
          −
        </button>

        <span
          class="number"
          id="awayYellows">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','yellows',1)">
          +
        </button>

      </div>

    </div>


    <!-- ROJAS -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','reds',-1)">
          −
        </button>

        <span
          class="number"
          id="homeReds">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','reds',1)">
          +
        </button>

      </div>


      <div class="label">
        🟥 Rojas
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','reds',-1)">
          −
        </button>

        <span
          class="number"
          id="awayReds">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','reds',1)">
          +
        </button>

      </div>

    </div>


    <!-- FALTAS -->

    <div class="stat">

      <div class="side">

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','fouls',-1)">
          −
        </button>

        <span
          class="number"
          id="homeFouls">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('home','fouls',1)">
          +
        </button>

      </div>


      <div class="label">
        ⚠️ Faltas
      </div>


      <div class="side right">

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','fouls',-1)">
          −
        </button>

        <span
          class="number"
          id="awayFouls">
          0
        </span>

        <button
          type="button"
          class="btn"
          onclick="changeStat('away','fouls',1)">
          +
        </button>

      </div>

    </div>

  </div>


  <div class="message" id="message">

    Probá los botones. El minuto y cada estadística deben cambiar inmediatamente.

  </div>

</div>


<script>

/*
========================================
DATOS
========================================
*/

const match = {

  minute:0,

  home:{
    arrivals:0,
    shots:0,
    target:0,
    goals:0,
    corners:0,
    yellows:0,
    reds:0,
    fouls:0
  },

  away:{
    arrivals:0,
    shots:0,
    target:0,
    goals:0,
    corners:0,
    yellows:0,
    reds:0,
    fouls:0
  }

};


/*
========================================
MINUTOS
========================================
*/

function changeMinute(amount){

  match.minute += amount;

  if(match.minute < 0){
    match.minute = 0;
  }

  if(match.minute > 90){
    match.minute = 90;
  }

  render();

}


/*
========================================
ESTADÍSTICAS
========================================
*/

function changeStat(team,stat,amount){

  const side = match[team];


  if(amount === 1){

    /*
    GOL
    */

    if(stat === "goals"){

      side.goals += 1;
      side.arrivals += 1;
      side.shots += 1;
      side.target += 1;

    }


    /*
    AL ARCO
    */

    else if(stat === "target"){

      side.target += 1;
      side.shots += 1;
      side.arrivals += 1;

    }


    /*
    TIRO
    */

    else if(stat === "shots"){

      side.shots += 1;
      side.arrivals += 1;

    }


    /*
    LLEGADA
    */

    else if(stat === "arrivals"){

      side.arrivals += 1;

    }


    /*
    CÓRNER
    */

    else if(stat === "corners"){

      side.corners += 1;

    }


    /*
    AMARILLA
    */

    else if(stat === "yellows"){

      side.yellows += 1;

    }


    /*
    ROJA
    */

    else if(stat === "reds"){

      side.reds += 1;

    }


    /*
    FALTA
    */

    else if(stat === "fouls"){

      side.fouls += 1;

    }

  }


  if(amount === -1){

    /*
    GOL
    */

    if(
      stat === "goals" &&
      side.goals > 0
    ){

      side.goals -= 1;

      side.target =
        Math.max(
          0,
          side.target - 1
        );

      side.shots =
        Math.max(
          0,
          side.shots - 1
        );

      side.arrivals =
        Math.max(
          0,
          side.arrivals - 1
        );

    }


    /*
    AL ARCO
    */

    else if(
      stat === "target" &&
      side.target > 0
    ){

      side.target -= 1;

      side.shots =
        Math.max(
          0,
          side.shots - 1
        );

      side.arrivals =
        Math.max(
          0,
          side.arrivals - 1
        );

    }


    /*
    TIRO
    */

    else if(
      stat === "shots" &&
      side.shots > 0
    ){

      side.shots -= 1;

      side.arrivals =
        Math.max(
          0,
          side.arrivals - 1
        );

    }


    /*
    LLEGADA
    */

    else if(
      stat === "arrivals" &&
      side.arrivals > 0
    ){

      side.arrivals -= 1;

    }


    /*
    CÓRNER
    */

    else if(
      stat === "corners" &&
      side.corners > 0
    ){

      side.corners -= 1;

    }


    /*
    AMARILLA
    */

    else if(
      stat === "yellows" &&
      side.yellows > 0
    ){

      side.yellows -= 1;

    }


    /*
    ROJA
    */

    else if(
      stat === "reds" &&
      side.reds > 0
    ){

      side.reds -= 1;

    }


    /*
    FALTA
    */

    else if(
      stat === "fouls" &&
      side.fouls > 0
    ){

      side.fouls -= 1;

    }

  }


  render();

}


/*
========================================
RENDER
========================================
*/

function render(){

  /*
  MINUTO
  */

  document.getElementById("minute").textContent =
    match.minute;


  /*
  MARCADOR
  */

  document.getElementById("homeGoals").textContent =
    match.home.goals;

  document.getElementById("awayGoals").textContent =
    match.away.goals;


  /*
  LLEGADAS
  */

  document.getElementById("homeArrivals").textContent =
    match.home.arrivals;

  document.getElementById("awayArrivals").textContent =
    match.away.arrivals;


  /*
  TIROS
  */

  document.getElementById("homeShots").textContent =
    match.home.shots;

  document.getElementById("awayShots").textContent =
    match.away.shots;


  /*
  AL ARCO
  */

  document.getElementById("homeTarget").textContent =
    match.home.target;

  document.getElementById("awayTarget").textContent =
    match.away.target;


  /*
  GOLES DE LA TABLA
  */

  document.getElementById("homeGoalsStat").textContent =
    match.home.goals;

  document.getElementById("awayGoalsStat").textContent =
    match.away.goals;


  /*
  CÓRNERS
  */

  document.getElementById("homeCorners").textContent =
    match.home.corners;

  document.getElementById("awayCorners").textContent =
    match.away.corners;


  /*
  AMARILLAS
  */

  document.getElementById("homeYellows").textContent =
    match.home.yellows;

  document.getElementById("awayYellows").textContent =
    match.away.yellows;


  /*
  ROJAS
  */

  document.getElementById("homeReds").textContent =
    match.home.reds;

  document.getElementById("awayReds").textContent =
    match.away.reds;


  /*
  FALTAS
  */

  document.getElementById("homeFouls").textContent =
    match.home.fouls;

  document.getElementById("awayFouls").textContent =
    match.away.fouls;


  /*
  MENSAJE
  */

  document.getElementById("message").textContent =
    "Controles funcionando · " +
    match.minute +
    "' · River " +
    match.home.goals +
    "-" +
    match.away.goals +
    " Boca";

}


render();

</script>

</body>
</html>
