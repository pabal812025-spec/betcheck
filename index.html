<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MatchIA</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#fff}
header{background:#0b192b;padding:16px;text-align:center;border-bottom:1px solid #20354f;position:sticky;top:0;z-index:20}
header h1{margin:0;color:#27e0a3;font-size:28px}
header p{margin:5px 0 0;color:#9db0c5;font-size:13px}
main{max-width:950px;margin:auto;padding:14px}
button,input,select{font:inherit}
button{border:0;border-radius:10px;padding:10px 13px;margin:3px;background:#18304a;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.12)}
.primary{background:#16a77d}.danger{background:#a83b4d}.back{background:#34465d}
.card{background:#0e1d30;border:1px solid #233a56;border-radius:16px;padding:15px;margin-bottom:13px}
.hidden{display:none!important}
.small{color:#9fb2c8;font-size:12px}
.center{text-align:center}
.green{color:#27e0a3}.yellow{color:#ffd166}.red{color:#ff6b7d}
.badge{display:inline-block;background:#193a53;color:#8eeed2;padding:5px 9px;border-radius:8px;font-size:11px}
.status{padding:9px;border-radius:9px;background:#142943;margin-bottom:12px;text-align:center;font-size:12px}
.ok{color:#27e0a3}.demo{color:#ffd166}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.nav button{margin:0;font-size:12px}
input,select{width:100%;padding:12px;border-radius:11px;border:1px solid #30445e;background:#101f33;color:#fff;margin-bottom:9px}
.datebar{display:flex;gap:6px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}
.datebar::-webkit-scrollbar{display:none}
.date{min-width:68px;background:#101f33;border:1px solid #30445e;border-radius:12px;padding:8px 5px;text-align:center;cursor:pointer}
.date.today{background:#16a77d;border-color:#27e0a3;color:#04130f}
.date b{display:block;font-size:15px}
.date span{font-size:11px;color:#9fb2c8}
.date.today span{color:#06291f}
.section-title{color:#27e0a3;margin:2px 0 12px}
.competition{background:#101f33;border:1px solid #243b57;border-radius:13px;margin-bottom:9px;overflow:hidden}
.comp-head{padding:11px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
