<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchIA</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#07111f;
      color:#fff;
    }

    .app{
      max-width:520px;
      margin:0 auto;
      min-height:100vh;
      background:#0b1728;
      padding-bottom:40px;
    }

    header{
      padding:18px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#0d1b2e;
      border-bottom:1px solid #1d3048;
    }

    .logo{
      font-size:24px;
      font-weight:800;
      color:#35e08b;
    }

    .header-icons{
      display:flex;
      gap:10px;
    }

    .icon-btn{
      width:38px;
      height:38px;
      border:0;
      border-radius:10px;
      background:#16263d;
      color:#fff;
      font-size:18px;
      cursor:pointer;
    }

    .content{
      padding:16px;
    }

    .match-card{
      background:#101f34;
      border:1px solid #203653;
      border-radius:18px;
      padding:16px;
      margin-bottom:16px;
    }

    .match-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
      color:#9db0c8;
      font-size:13px;
    }

    .teams{
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      gap:8px;
    }

    .team{
      text-align:center;
    }

    .team-name{
      font-size:17px;
      font-weight:700;
      margin-bottom:8px;
    }

    .score{
      text-align:center;
      font-size:34px;
      font-weight:800;
    }

    .minute{
      text-align:center;
      color:#35e08b;
      font-weight:700;
      font-size:13px;
      margin-top:4px;
    }

    .probabilities{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .prob{
      background:#0b1728;
      border-radius:12px;
      padding:10px 6px;
      text-align:center;
    }

    .prob-value{
      font-size:22px;
      font-weight:800;
      color:#35e08b;
    }

    .prob-label{
      color:#9db0c8;
      font-size:11px;
      margin-top:4px;
    }

    .stats{
      margin-top:18px;
    }

    .stats-title{
      font-size:14px;
      font-weight:700;
      margin-bottom:10px;
    }

    .stat-row{
      display:grid;
      grid-template-columns:1fr 70px 1fr;
      align-items:center;
      margin:8px 0;
    }

    .stat-value{
      text-align:center;
      font-weight:700;
    }

    .stat-name{
      text-align:center;
      color:#8fa3bc;
      font-size:11px;
    }

    .stat-left{
      text-align:left;
    }

    .stat-right{
      text-align:right;
    }

    .controls{
      margin-top:18px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    button.action{
      border:0;
      border-radius:10px;
      padding:11px 8px;
      background:#1a304d;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    button.action:hover{
      background:#244366;
    }

    .analysis{
      margin-top:18px;
      background:#0b1728;
      border-radius:12px;
      padding:13px;
      color:#c5d2e2;
      line-height:1.45;
      font-size:13px;
    }

    .analysis strong{
      color:#fff;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .small{
      font-size:12px;
      color:#8fa3bc;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">⚽ MatchIA</div>

    <div class="header-icons">
      <button class="icon-btn" onclick="showMessage('Notificaciones')">🔔</button>
      <button class="icon-btn" onclick="showMessage('Configuración')">⚙️</button>
    </div>
  </header>

  <div class="content">

    <div class="section-title">Análisis del partido</div>

    <div class="match-card">

      <div class="match-top">
        <span>Demo · Partido en vivo</span>
        <span id="status">EN VIVO</span>
      </div>

      <div class="teams">

        <div class="team">
          <div class="team-name">River</div>
        </div>

        <div>
          <div class="score">
            <span id="homeGoals">0</span>
            -
            <span id="awayGoals">0</span>
          </div>

          <div class="minute">
            <span id="minute">89</span>'
          </div>
        </div>

        <div class="team">
          <div class="team-name">Boca</div>
        </div>

      </div>

      <div class="probabilities">

        <div class="prob">
          <div class="prob-value" id="homeProb">33%</div>
          <div class="prob-label">River</div>
        </div>

        <div class="prob">
          <div class="prob-value" id="drawProb">34%</div>
          <div class="prob-label">Empate</div>
        </div>

        <div class="prob">
          <div class="prob-value" id="awayProb">33%</div>
          <div class="prob-label">Boca</div>
        </div>

      </div>

      <div class="stats">

        <div class="stats-title">Estadísticas</div>

        <div class="stat-row">
          <div class="stat-value stat-left" id="homeArrivals">0</div>
          <div class="stat-name">🔥 Llegadas</div>
          <div class="stat-value stat-right" id="awayArrivals">0</div>
        </div>

        <div class="stat-row">
          <div class="stat-value stat-left" id="homeShots">0</div>
          <div class="stat-name">🎯 Tiros</div>
          <div class="stat-value stat-right" id="awayShots">0</div>
        </div>

        <div class="stat-row">
          <div class="stat-value stat-left" id="homeOnTarget">0</div>
          <div class="stat-name">🎯 Al arco</div>
          <div class="stat-value stat-right" id="awayOnTarget">0</div>
        </div>

        <div class="stat-row">
          <div class="stat-value stat-left" id="homeCorners">0</div>
          <div class="stat-name">🚩 Córners</div>
          <div class="stat-value stat-right" id="awayCorners">0</div>
        </div>

        <div class="stat-row">
          <div class="stat-value stat-left" id="homeReds">0</div>
          <div class="stat-name">🟥 Rojas</div>
          <div class="stat-value stat-right" id="awayReds">0</div>
        </div>

      </div>

      <div class="controls">

        <button class="action" onclick="changeStat('home','arrival',1)">
          River + Llegada
        </button>

        <button class="action" onclick="changeStat('away','arrival',1)">
          Boca + Llegada
        </button>

        <button class="action" onclick="changeStat('home','shot',1)">
          River + Tiro
        </button>

        <button class="action" onclick="changeStat('away','shot',1)">
          Boca + Tiro
        </button>

        <button class="action" onclick="changeStat('home','target',1)">
          River + Al arco
        </button>

        <button class="action" onclick="changeStat('away','target',1)">
          Boca + Al arco
        </button>

        <button class="action" onclick="changeStat('home','goal',1)">
          River + Gol
        </button>

        <button class="action" onclick="changeStat('away','goal',1)">
          Boca + Gol
        </button>

        <button class="action" onclick="changeStat('home','corner',1)">
          River + Córner
        </button>

        <button class="action" onclick="changeStat('away','corner',1)">
          Boca + Córner
        </button>

        <button class="action" onclick="changeStat('home','red',1)">
          River + Roja
        </button>

        <button class="action" onclick="changeStat('away','red',1)">
          Boca + Roja
        </button>

      </div>

      <div class="analysis">
        <strong>Análisis MatchIA</strong>
        <div id="analysisText">
          Analizando el desarrollo del partido...
        </div>
      </div>

    </div>

  </div>

</div>


<script>

  const match = {

    minute: 89,

    homeGoals: 0,
    awayGoals: 0,

    homeArrivals: 0,
    awayArrivals: 0,

    homeShots: 0,
    awayShots: 0,

    homeOnTarget: 0,
    awayOnTarget: 0,

    homeCorners: 0,
    awayCorners: 0,

    homeReds: 0,
    awayReds: 0
  };


  function clamp(value,min,max){

    return Math.max(min,Math.min(max,value));

  }


  function calculateProbabilities(){

    const minute = clamp(
      Number(match.minute) || 0,
      0,
      90
    );


    const hg = Number(match.homeGoals) || 0;
    const ag = Number(match.awayGoals) || 0;

    const ha = Number(match.homeArrivals) || 0;
    const aa = Number(match.awayArrivals) || 0;

    const hs = Number(match.homeShots) || 0;
    const as = Number(match.awayShots) || 0;

    const hot = Number(match.homeOnTarget) || 0;
    const aot = Number(match.awayOnTarget) || 0;

    const hc = Number(match.homeCorners) || 0;
    const ac = Number(match.awayCorners) || 0;

    const homeReds = Number(match.homeReds) || 0;
    const awayReds = Number(match.awayReds) || 0;


    /*
      BASE
    */

    let home = 33;
    let draw = 34;
    let away = 33;


    /*
      LLEGADAS
    */

    const arrivalDiff = ha - aa;

    home += arrivalDiff * 0.55;
    away -= arrivalDiff * 0.55;


    /*
      TIROS
    */

    const shotDiff = hs - as;

    home += shotDiff * 0.30;
    away -= shotDiff * 0.30;


    /*
      TIROS AL ARCO

      Tienen bastante más peso que un tiro común.
    */

    const targetDiff = hot - aot;

    home += targetDiff * 1.15;
    away -= targetDiff * 1.15;


    /*
      CÓRNERS
    */

    const cornerDiff = hc - ac;

    home += cornerDiff * 0.20;
    away -= cornerDiff * 0.20;


    /*
      MARCADOR

      El peso aumenta a medida que avanza
      el partido.
    */

    const goalDiff = hg - ag;

    let goalWeight = 4.5;

    if(minute <= 15){
      goalWeight = 4.5;
    }
    else if(minute <= 30){
      goalWeight = 6.0;
    }
    else if(minute <= 45){
      goalWeight = 7.5;
    }
    else if(minute <= 60){
      goalWeight = 9.0;
    }
    else if(minute <= 75){
      goalWeight = 12.0;
    }
    else if(minute <= 85){
      goalWeight = 16.0;
    }
    else{
      goalWeight = 22.0;
    }


    home += goalDiff * goalWeight;
    away -= goalDiff * goalWeight;

    draw -= Math.abs(goalDiff) * (goalWeight * 0.35);


    /*
      SI ESTÁN EMPATADOS

      El empate gana peso progresivamente
      cuanto menos tiempo queda.
    */

    if(goalDiff === 0){

      const timeWeight =
        Math.min(minute,90) / 90;

      draw += timeWeight * 8;

      home -= timeWeight * 4;
      away -= timeWeight * 4;

    }


    /*
      TARJETAS ROJAS
    */

    const redDifference =
      awayReds - homeReds;

    home += redDifference * 7;
    away -= redDifference * 7;


    if(homeReds > 0){

      away += homeReds * 2;
      home -= homeReds * 2;

    }


    if(awayReds > 0){

      home += awayReds * 2;
      away -= awayReds * 2;

    }


    /*
      CIERRE DE PARTIDO

      A partir del 85' el marcador tiene cada vez
      más peso.

      Pero ahora además diferenciamos la cantidad
      de goles de ventaja.

      Esto evita que un 5-0 termine con porcentajes
      absurdamente bajos por problemas matemáticos.
    */

    if(minute >= 85){

      /*
        Objetivo general de concentración.
      */

      let lateTarget =
        90 +
        7.5 *
        Math.pow(
          (Math.min(minute,90) - 85) / 5,
          1.15
        );


      lateTarget =
        clamp(
          lateTarget,
          90,
          97.5
        );


      const remaining =
        100 - lateTarget;


      /*
        EMPATE
      */

      if(hg === ag){

        const positiveHome =
          Math.max(home,0);

        const positiveAway =
          Math.max(away,0);

        const nonDraw =
          positiveHome + positiveAway;


        if(nonDraw > 0){

          home =
            (positiveHome / nonDraw) *
            remaining;

          away =
            (positiveAway / nonDraw) *
            remaining;

        }
        else{

          home =
            remaining / 2;

          away =
            remaining / 2;

        }


        draw =
          lateTarget;

      }


      /*
        LOCAL VA GANANDO
      */

      else if(hg > ag){

        /*
          Diferencia de goles.
        */

        const goalLead =
          hg - ag;


        /*
          CASO MUY AMPLIO

          Con 3 o más goles de diferencia
          a los 89' el resultado queda
          prácticamente cerrado.

          Con 4 o más:
          100% directo.
        */

        if(minute >= 89 && goalLead >= 4){

          home = 100;
          draw = 0;
          away = 0;

        }

        else if(minute >= 89 && goalLead === 3){

          home = 99.6;
          draw = 0.25;
          away = 0.15;

        }

        else if(minute >= 89 && goalLead === 2){

          home = 99.0;
          draw = 0.7;
          away = 0.3;

        }

        else{

          const positiveDraw =
            Math.max(draw,0);

          const positiveAway =
            Math.max(away,0);

          const nonHome =
            positiveDraw + positiveAway;


          home =
            lateTarget;


          if(nonHome > 0){

            draw =
              (positiveDraw / nonHome) *
              remaining;

            away =
              (positiveAway / nonHome) *
              remaining;

          }
          else{

            draw =
              remaining * 0.75;

            away =
              remaining * 0.25;

          }

        }

      }


      /*
        VISITANTE VA GANANDO
      */

      else{

        const goalLead =
          ag - hg;


        /*
          Misma lógica para el visitante.
        */

        if(minute >= 89 && goalLead >= 4){

          away = 100;
          draw = 0;
          home = 0;

        }

        else if(minute >= 89 && goalLead === 3){

          away = 99.6;
          draw = 0.25;
          home = 0.15;

        }

        else if(minute >= 89 && goalLead === 2){

          away = 99.0;
          draw = 0.7;
          home = 0.3;

        }

        else{

          const positiveHome =
            Math.max(home,0);

          const positiveDraw =
            Math.max(draw,0);

          const nonAway =
            positiveHome + positiveDraw;


          away =
            lateTarget;


          if(nonAway > 0){

            home =
              (positiveHome / nonAway) *
              remaining;

            draw =
              (positiveDraw / nonAway) *
              remaining;

          }
          else{

            home =
              remaining * 0.25;

            draw =
              remaining * 0.75;

          }

        }

      }

    }


    /*
      MÍNIMOS ANTES DEL 85'
    */

    if(minute < 85){

      const minimumProbability =
        minute < 75 ? 8 : 3;

      home =
        clamp(
          home,
          minimumProbability,
          94
        );

      draw =
        clamp(
          draw,
          minimumProbability,
          94
        );

      away =
        clamp(
          away,
          minimumProbability,
          94
        );

    }


    /*
      SEGURIDAD FINAL
    */

    home =
      Math.max(home,0);

    draw =
      Math.max(draw,0);

    away =
      Math.max(away,0);


    const total =
      home + draw + away;


    if(
      !Number.isFinite(total) ||
      total <= 0
    ){

      return {
        home:33,
        draw:34,
        away:33
      };

    }


    return {

      home:
        home / total * 100,

      draw:
        draw / total * 100,

      away:
        away / total * 100

    };

  }


  /*
    CAMBIO DE ESTADÍSTICAS

    Llegada:
      +1 llegada

    Tiro:
      +1 tiro
      +1 llegada

    Al arco:
      +1 al arco
      +1 tiro
      +1 llegada

    Gol:
      +1 gol
      +1 al arco
      +1 tiro
      +1 llegada

    Roja:
      +1 roja

    Córner:
      +1 córner

    Al restar una estadística solamente
    se resta esa estadística.
  */

  function changeStat(team,stat,amount){

    const prefix =
      team === 'home'
        ? 'home'
        : 'away';


    const value =
      Number(amount) || 0;


    if(stat === 'arrival'){

      match[prefix + 'Arrivals'] += value;

    }


    else if(stat === 'shot'){

      match[prefix + 'Shots'] += value;

      if(value > 0){

        match[prefix + 'Arrivals'] += value;

      }

    }


    else if(stat === 'target'){

      match[prefix + 'OnTarget'] += value;

      if(value > 0){

        match[prefix + 'Shots'] += value;
        match[prefix + 'Arrivals'] += value;

      }

    }


    else if(stat === 'goal'){

      match[prefix + 'Goals'] += value;

      if(value > 0){

        match[prefix + 'OnTarget'] += value;
        match[prefix + 'Shots'] += value;
        match[prefix + 'Arrivals'] += value;

      }

    }


    else if(stat === 'corner'){

      match[prefix + 'Corners'] += value;

    }


    else if(stat === 'red'){

      match[prefix + 'Reds'] += value;

    }


    /*
      Nunca permitir valores negativos.
    */

    match[prefix + 'Arrivals'] =
      Math.max(0,match[prefix + 'Arrivals']);

    match[prefix + 'Shots'] =
      Math.max(0,match[prefix + 'Shots']);

    match[prefix + 'OnTarget'] =
      Math.max(0,match[prefix + 'OnTarget']);

    match[prefix + 'Goals'] =
      Math.max(0,match[prefix + 'Goals']);

    match[prefix + 'Corners'] =
      Math.max(0,match[prefix + 'Corners']);

    match[prefix + 'Reds'] =
      Math.max(0,match[prefix + 'Reds']);


    render();

  }


  function render(){

    document.getElementById('homeGoals').textContent =
      match.homeGoals;

    document.getElementById('awayGoals').textContent =
      match.awayGoals;


    document.getElementById('minute').textContent =
      match.minute;


    document.getElementById('homeArrivals').textContent =
      match.homeArrivals;

    document.getElementById('awayArrivals').textContent =
      match.awayArrivals;


    document.getElementById('homeShots').textContent =
      match.homeShots;

    document.getElementById('awayShots').textContent =
      match.awayShots;


    document.getElementById('homeOnTarget').textContent =
      match.homeOnTarget;

    document.getElementById('awayOnTarget').textContent =
      match.awayOnTarget;


    document.getElementById('homeCorners').textContent =
      match.homeCorners;

    document.getElementById('awayCorners').textContent =
      match.awayCorners;


    document.getElementById('homeReds').textContent =
      match.homeReds;

    document.getElementById('awayReds').textContent =
      match.awayReds;


    const probabilities =
      calculateProbabilities();


    document.getElementById('homeProb').textContent =
      Math.round(probabilities.home) + '%';

    document.getElementById('drawProb').textContent =
      Math.round(probabilities.draw) + '%';

    document.getElementById('awayProb').textContent =
      Math.round(probabilities.away) + '%';


    updateAnalysis(probabilities);

  }


  function updateAnalysis(probabilities){

    const minute =
      match.minute;

    const hg =
      match.homeGoals;

    const ag =
      match.awayGoals;


    let text =
      minute + "' · " +
      hg + "-" +
      ag + ". ";


    if(hg === ag){

      text +=
        "El marcador está igualado y todavía puede producirse un cambio en el resultado.";

    }

    else if(hg > ag){

      const difference =
        hg - ag;


      if(minute >= 89 && difference >= 4){

        text +=
          "Queda muy poco tiempo y la diferencia de goles hace que el resultado esté prácticamente cerrado.";

      }

      else if(minute >= 89 && difference >= 2){

        text +=
          "Queda muy poco tiempo y la diferencia de goles concentra casi toda la probabilidad en River.";

      }

      else{

        text +=
          "River está por delante en el marcador y el tiempo restante aumenta el peso del resultado actual.";

      }

    }

    else{

      const difference =
        ag - hg;


      if(minute >= 89 && difference >= 4){

        text +=
          "Queda muy poco tiempo y la diferencia de goles hace que el resultado esté prácticamente cerrado.";

      }

      else if(minute >= 89 && difference >= 2){

        text +=
          "Queda muy poco tiempo y la diferencia de goles concentra casi toda la probabilidad en Boca.";

      }

      else{

        text +=
          "Boca está por delante en el marcador y el tiempo restante aumenta el peso del resultado actual.";

      }

    }


    document.getElementById('analysisText').textContent =
      text;

  }


  function showMessage(message){

    alert(message);

  }


  /*
    INICIO
  */

  render();

</script>

</body>
</html>
