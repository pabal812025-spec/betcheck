<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchIA</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#07111f;
      color:#fff;
    }

    .app{
      max-width:520px;
      margin:0 auto;
      min-height:100vh;
      background:#0b1728;
      padding-bottom:40px;
    }

    header{
      padding:18px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#0d1b2e;
      border-bottom:1px solid #1d3048;
    }

    .logo{
      font-size:24px;
      font-weight:800;
      color:#35e08b;
    }

    .header-icons{
      display:flex;
      gap:10px;
    }

    .icon-btn{
      width:38px;
      height:38px;
      border:0;
      border-radius:10px;
      background:#16263d;
      color:#fff;
      font-size:18px;
      cursor:pointer;
    }

    .content{
      padding:16px;
    }

    .match-card{
      background:#101f34;
      border:1px solid #203653;
      border-radius:18px;
      padding:16px;
      margin-bottom:16px;
    }

    .match-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
      color:#9db0c8;
      font-size:13px;
    }

    .teams{
      display:grid;
      grid-template-columns:1fr 90px 1fr;
      align-items:center;
      gap:8px;
    }

    .team{
      text-align:center;
    }

    .team-name{
      font-size:17px;
      font-weight:700;
      margin-bottom:8px;
    }

    .score{
      text-align:center;
      font-size:34px;
      font-weight:800;
    }

    .minute{
      text-align:center;
      color:#35e08b;
      font-weight:700;
      font-size:13px;
      margin-top:4px;
    }

    .time-controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:7px;
      margin-top:10px;
    }

    .time-btn{
      width:34px;
      height:30px;
      border:0;
      border-radius:8px;
      background:#1a304d;
      color:#fff;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
    }

    .time-btn:hover{
      background:#244366;
    }

    .time-label{
      min-width:48px;
      text-align:center;
      color:#9db0c8;
      font-size:12px;
    }

    .probabilities{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .prob{
      background:#0b1728;
      border-radius:12px;
      padding:10px 6px;
      text-align:center;
    }

    .prob-value{
      font-size:22px;
      font-weight:800;
      color:#35e08b;
    }

    .prob-label{
      color:#9db0c8;
      font-size:11px;
      margin-top:4px;
    }

    .stats{
      margin-top:18px;
    }

    .stats-title{
      font-size:14px;
      font-weight:700;
      margin-bottom:10px;
    }

    .stat-row{
      display:grid;
      grid-template-columns:70px 1fr 70px;
      align-items:center;
      gap:8px;
      margin:10px 0;
    }

    .stat-side{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .stat-side.right{
      justify-content:flex-end;
    }

    .stat-number{
      font-weight:700;
      min-width:20px;
      text-align:center;
    }

    .stat-name{
      text-align:center;
      color:#8fa3bc;
      font-size:11px;
    }

    .stat-btn{
      width:28px;
      height:28px;
      border:0;
      border-radius:7px;
      background:#1a304d;
      color:#fff;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      line-height:28px;
      padding:0;
    }

    .stat-btn:hover{
      background:#244366;
    }

    .analysis{
      margin-top:18px;
      background:#0b1728;
      border-radius:12px;
      padding:13px;
      color:#c5d2e2;
      line-height:1.45;
      font-size:13px;
    }

    .analysis strong{
      color:#fff;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="logo">
      ⚽ MatchIA
    </div>

    <div class="header-icons">

      <button
        class="icon-btn"
        onclick="showMessage('Notificaciones')"
      >
        🔔
      </button>

      <button
        class="icon-btn"
        onclick="showMessage('Configuración')"
      >
        ⚙️
      </button>

    </div>

  </header>


  <div class="content">

    <div class="section-title">
      Análisis del partido
    </div>


    <div class="match-card">

      <div class="match-top">

        <span>
          Demo · Partido en vivo
        </span>

        <span id="status">
          EN VIVO
        </span>

      </div>


      <div class="teams">


        <div class="team">

          <div class="team-name">
            River
          </div>

        </div>


        <div>

          <div class="score">

            <span id="homeGoals">
              0
            </span>

            -

            <span id="awayGoals">
              0
            </span>

          </div>


          <div class="minute">

            <span id="minute">
              89
            </span>'

          </div>


          <div class="time-controls">

            <button
              class="time-btn"
              onclick="changeMinute(-1)"
            >
              −
            </button>

            <div class="time-label">
              Minuto
            </div>

            <button
              class="time-btn"
              onclick="changeMinute(1)"
            >
              +
            </button>

          </div>

        </div>


        <div class="team">

          <div class="team-name">
            Boca
          </div>

        </div>

      </div>


      <div class="probabilities">

        <div class="prob">

          <div
            class="prob-value"
            id="homeProb"
          >
            33%
          </div>

          <div class="prob-label">
            River
          </div>

        </div>


        <div class="prob">

          <div
            class="prob-value"
            id="drawProb"
          >
            34%
          </div>

          <div class="prob-label">
            Empate
          </div>

        </div>


        <div class="prob">

          <div
            class="prob-value"
            id="awayProb"
          >
            33%
          </div>

          <div class="prob-label">
            Boca
          </div>

        </div>

      </div>


      <div class="stats">

        <div class="stats-title">
          Estadísticas
        </div>


        <!-- LLEGADAS -->

        <div class="stat-row">

          <div class="stat-side">

            <button
              class="stat-btn"
              onclick="changeStat('home','arrival',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="homeArrivals"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('home','arrival',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🔥 Llegadas
          </div>


          <div class="stat-side right">

            <button
              class="stat-btn"
              onclick="changeStat('away','arrival',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="awayArrivals"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('away','arrival',1)"
            >
              +
            </button>

          </div>

        </div>


        <!-- TIROS -->

        <div class="stat-row">

          <div class="stat-side">

            <button
              class="stat-btn"
              onclick="changeStat('home','shot',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="homeShots"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('home','shot',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🎯 Tiros
          </div>


          <div class="stat-side right">

            <button
              class="stat-btn"
              onclick="changeStat('away','shot',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="awayShots"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('away','shot',1)"
            >
              +
            </button>

          </div>

        </div>


        <!-- AL ARCO -->

        <div class="stat-row">

          <div class="stat-side">

            <button
              class="stat-btn"
              onclick="changeStat('home','target',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="homeOnTarget"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('home','target',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🎯 Al arco
          </div>


          <div class="stat-side right">

            <button
              class="stat-btn"
              onclick="changeStat('away','target',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="awayOnTarget"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('away','target',1)"
            >
              +
            </button>

          </div>

        </div>


        <!-- GOLES -->

        <div class="stat-row">

          <div class="stat-side">

            <button
              class="stat-btn"
              onclick="changeStat('home','goal',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="homeGoalsStat"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('home','goal',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            ⚽ Goles
          </div>


          <div class="stat-side right">

            <button
              class="stat-btn"
              onclick="changeStat('away','goal',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="awayGoalsStat"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('away','goal',1)"
            >
              +
            </button>

          </div>

        </div>


        <!-- CÓRNERS -->

        <div class="stat-row">

          <div class="stat-side">

            <button
              class="stat-btn"
              onclick="changeStat('home','corner',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="homeCorners"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('home','corner',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🚩 Córners
          </div>


          <div class="stat-side right">

            <button
              class="stat-btn"
              onclick="changeStat('away','corner',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="awayCorners"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('away','corner',1)"
            >
              +
            </button>

          </div>

        </div>


        <!-- ROJAS -->

        <div class="stat-row">

          <div class="stat-side">

            <button
              class="stat-btn"
              onclick="changeStat('home','red',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="homeReds"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('home','red',1)"
            >
              +
            </button>

          </div>


          <div class="stat-name">
            🟥 Rojas
          </div>


          <div class="stat-side right">

            <button
              class="stat-btn"
              onclick="changeStat('away','red',-1)"
            >
              −
            </button>

            <span
              class="stat-number"
              id="awayReds"
            >
              0
            </span>

            <button
              class="stat-btn"
              onclick="changeStat('away','red',1)"
            >
              +
            </button>

          </div>

        </div>

      </div>


      <div class="analysis">

        <strong>
          Análisis MatchIA
        </strong>

        <div id="analysisText">
          Analizando el desarrollo del partido...
        </div>

      </div>

    </div>

  </div>

</div>


<script>


  const match = {

    minute:89,

    homeGoals:0,
    awayGoals:0,

    homeArrivals:0,
    awayArrivals:0,

    homeShots:0,
    awayShots:0,

    homeOnTarget:0,
    awayOnTarget:0,

    homeCorners:0,
    awayCorners:0,

    homeReds:0,
    awayReds:0

  };


  function clamp(
    value,
    min,
    max
  ){

    return Math.max(
      min,
      Math.min(max,value)
    );

  }


  /*
    MINUTOS
  */

  function changeMinute(
    amount
  ){

    match.minute =
      clamp(
        match.minute + amount,
        0,
        90
      );

    render();

  }


  /*
    PROBABILIDADES
  */

  function calculateProbabilities(){

    const minute =
      clamp(
        Number(match.minute) || 0,
        0,
        90
      );


    const hg =
      Number(match.homeGoals) || 0;

    const ag =
      Number(match.awayGoals) || 0;


    const ha =
      Number(match.homeArrivals) || 0;

    const aa =
      Number(match.awayArrivals) || 0;


    const hs =
      Number(match.homeShots) || 0;

    const as =
      Number(match.awayShots) || 0;


    const hot =
      Number(match.homeOnTarget) || 0;

    const aot =
      Number(match.awayOnTarget) || 0;


    const hc =
      Number(match.homeCorners) || 0;

    const ac =
      Number(match.awayCorners) || 0;


    const homeReds =
      Number(match.homeReds) || 0;

    const awayReds =
      Number(match.awayReds) || 0;


    let home = 33;
    let draw = 34;
    let away = 33;


    /*
      LLEGADAS
    */

    const arrivalDiff =
      ha - aa;


    home +=
      arrivalDiff * 0.55;

    away -=
      arrivalDiff * 0.55;


    /*
      TIROS
    */

    const shotDiff =
      hs - as;


    home +=
      shotDiff * 0.30;

    away -=
      shotDiff * 0.30;


    /*
      AL ARCO
    */

    const targetDiff =
      hot - aot;


    home +=
      targetDiff * 1.15;

    away -=
      targetDiff * 1.15;


    /*
      CÓRNERS
    */

    const cornerDiff =
      hc - ac;


    home +=
      cornerDiff * 0.20;

    away -=
      cornerDiff * 0.20;


    /*
      MARCADOR
    */

    const goalDiff =
      hg - ag;


    let goalWeight = 4.5;


    if(minute <= 15){

      goalWeight = 4.5;

    }

    else if(minute <= 30){

      goalWeight = 6.0;

    }

    else if(minute <= 45){

      goalWeight = 7.5;

    }

    else if(minute <= 60){

      goalWeight = 9.0;

    }

    else if(minute <= 75){

      goalWeight = 12.0;

    }

    else if(minute <= 85){

      goalWeight = 16.0;

    }

    else{

      goalWeight = 22.0;

    }


    home +=
      goalDiff * goalWeight;

    away -=
      goalDiff * goalWeight;


    draw -=
      Math.abs(goalDiff) *
      (goalWeight * 0.35);


    /*
      EMPATE
    */

    if(goalDiff === 0){

      const timeWeight =
        Math.min(minute,90) / 90;


      draw +=
        timeWeight * 8;


      home -=
        timeWeight * 4;


      away -=
        timeWeight * 4;

    }


    /*
      ROJAS
    */

    const redDifference =
      awayReds - homeReds;


    home +=
      redDifference * 7;


    away -=
      redDifference * 7;


    if(homeReds > 0){

      away +=
        homeReds * 2;

      home -=
        homeReds * 2;

    }


    if(awayReds > 0){

      home +=
        awayReds * 2;

      away -=
        awayReds * 2;

    }


    /*
      CIERRE
    */

    if(minute >= 85){

      let lateTarget =
        90 +
        7.5 *
        Math.pow(
          (Math.min(minute,90)-85)/5,
          1.15
        );


      lateTarget =
        clamp(
          lateTarget,
          90,
          97.5
        );


      const remaining =
        100 - lateTarget;


      /*
        EMPATE
      */

      if(hg === ag){

        const positiveHome =
          Math.max(home,0);


        const positiveAway =
          Math.max(away,0);


        const nonDraw =
          positiveHome +
          positiveAway;


        if(nonDraw > 0){

          home =
            (positiveHome/nonDraw) *
            remaining;


          away =
            (positiveAway/nonDraw) *
            remaining;

        }

        else{

          home =
            remaining/2;


          away =
            remaining/2;

        }


        draw =
          lateTarget;

      }


      /*
        LOCAL
      */

      else if(hg > ag){

        const goalLead =
          hg - ag;


        if(
          minute >= 89 &&
          goalLead >= 4
        ){

          home = 100;
          draw = 0;
          away = 0;

        }


        else if(
          minute >= 89 &&
          goalLead === 3
        ){

          home = 99.6;
          draw = 0.25;
          away = 0.15;

        }


        else if(
          minute >= 89 &&
          goalLead === 2
        ){

          home = 99.0;
          draw = 0.7;
          away = 0.3;

        }


        else{

          const positiveDraw =
            Math.max(draw,0);


          const positiveAway =
            Math.max(away,0);


          const nonHome =
            positiveDraw +
            positiveAway;


          home =
            lateTarget;


          if(nonHome > 0){

            draw =
              (positiveDraw/nonHome) *
              remaining;


            away =
              (positiveAway/nonHome) *
              remaining;

          }

          else{

            draw =
              remaining * 0.75;


            away =
              remaining * 0.25;

          }

        }

      }


      /*
        VISITANTE
      */

      else{

        const goalLead =
          ag - hg;


        if(
          minute >= 89 &&
          goalLead >= 4
        ){

          away = 100;
          draw = 0;
          home = 0;

        }


        else if(
          minute >= 89 &&
          goalLead === 3
        ){

          away = 99.6;
          draw = 0.25;
          home = 0.15;

        }


        else if(
          minute >= 89 &&
          goalLead === 2
        ){

          away = 99.0;
          draw = 0.7;
          home = 0.3;

        }


        else{

          const positiveHome =
            Math.max(home,0);


          const positiveDraw =
            Math.max(draw,0);


          const nonAway =
            positiveHome +
            positiveDraw;


          away =
            lateTarget;


          if(nonAway > 0){

            home =
              (positiveHome/nonAway) *
              remaining;


            draw =
              (positiveDraw/nonAway) *
              remaining;

          }

          else{

            home =
              remaining * 0.25;


            draw =
              remaining * 0.75;

          }

        }

      }

    }


    /*
      MÍNIMOS
    */

    if(minute < 85){

      const minimumProbability =
        minute < 75 ? 8 : 3;


      home =
        clamp(
          home,
          minimumProbability,
          94
        );


      draw =
        clamp(
          draw,
          minimumProbability,
          94
        );


      away =
        clamp(
          away,
          minimumProbability,
          94
        );

    }


    /*
      SEGURIDAD
    */

    home =
      Math.max(home,0);


    draw =
      Math.max(draw,0);


    away =
      Math.max(away,0);


    const total =
      home +
      draw +
      away;


    if(
      !Number.isFinite(total) ||
      total <= 0
    ){

      return {
        home:33,
        draw:34,
        away:33
      };

    }


    return {

      home:
        home / total * 100,

      draw:
        draw / total * 100,

      away:
        away / total * 100

    };

  }


  /*
    CAMBIO DE ESTADÍSTICA
  */

  function changeStat(
    team,
    stat,
    amount
  ){

    const prefix =
      team === 'home'
        ? 'home'
        : 'away';


    const value =
      Number(amount) || 0;


    /*
      LLEGADA
    */

    if(stat === 'arrival'){

      match[prefix + 'Arrivals'] +=
        value;

    }


    /*
      TIRO

      Al sumar tiro:
        +1 tiro
        +1 llegada

      Al quitar tiro:
        -1 tiro
        -1 llegada
    */

    else if(stat === 'shot'){

      if(value > 0){

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      }

      else if(value < 0){

        if(match[prefix + 'Shots'] > 0){

          match[prefix + 'Shots'] -= 1;

          match[prefix + 'Arrivals'] =
            Math.max(
              0,
              match[prefix + 'Arrivals'] - 1
            );

        }

      }

    }


    /*
      AL ARCO

      Al sumar:
        +1 al arco
        +1 tiro
        +1 llegada

      Al quitar:
        -1 al arco
        -1 tiro
        -1 llegada
    */

    else if(stat === 'target'){

      if(value > 0){

        match[prefix + 'OnTarget'] += 1;

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      }

      else if(value < 0){

        if(match[prefix + 'OnTarget'] > 0){

          match[prefix + 'OnTarget'] -= 1;

          match[prefix + 'Shots'] =
            Math.max(
              0,
              match[prefix + 'Shots'] - 1
            );

          match[prefix + 'Arrivals'] =
            Math.max(
              0,
              match[prefix + 'Arrivals'] - 1
            );

        }

      }

    }


    /*
      GOL

      Al sumar:
        +1 gol
        +1 al arco
        +1 tiro
        +1 llegada

      Al quitar:
        -1 gol
        -1 al arco
        -1 tiro
        -1 llegada
    */

    else if(stat === 'goal'){

      if(value > 0){

        match[prefix + 'Goals'] += 1;
