<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:#0d1b2f;
  padding:18px 16px;
  text-align:center;
  border-bottom:1px solid #203452;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:6px 0 0;
  color:#8fa6c5;
  font-size:13px;
}

main{
  max-width:700px;
  margin:auto;
  padding:16px;
}

.search{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #29415f;
  background:#0d1b2f;
  color:white;
  font-size:16px;
  margin-bottom:14px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  width:100%;
  background:#173456;
  color:white;
  margin-bottom:15px;
}

.card{
  background:#0d1b2f;
  border:1px solid #223b5d;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.league{
  color:#7fa8d8;
  font-size:12px;
  margin-bottom:12px;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.team{
  width:42%;
  text-align:center;
  font-weight:bold;
}

.vs{
  color:#7f93ad;
  font-size:13px;
}

.analyze{
  width:100%;
  margin-top:15px;
  background:#16a765;
  color:white;
  font-size:15px;
}

.hidden{
  display:none;
}

.back{
  background:#243c5b;
  color:white;
  margin-bottom:15px;
}

.score{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  margin:12px 0;
}

.live{
  text-align:center;
  color:#ffcc55;
  font-weight:bold;
}

.control-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.control-grid button{
  background:#1b3351;
  color:white;
}

.section{
  margin-top:16px;
}

.section h2{
  font-size:18px;
  margin-bottom:10px;
}

.market{
  margin:9px 0;
  padding:12px;
  background:#122641;
  border-radius:10px;
}

.percent{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.change{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

.up{
  color:#36d98b;
}

.down{
  color:#ff6b6b;
}

.same{
  color:#8fa6c5;
}

.bar{
  height:9px;
  background:#203a59;
  border-radius:10px;
  overflow:hidden;
  margin-top:7px;
}

.fill{
  height:100%;
  background:#16a765;
  transition:width .35s ease;
}

.explanation{
  background:#102a42;
  padding:14px;
  border-radius:12px;
  color:#d7e6f7;
  line-height:1.5;
}

.combo{
  background:#102b20;
  border:1px solid #246a46;
  padding:14px;
  border-radius:12px;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#8fa6c5;
}
</style>
</head>

<body>

<header>
  <h1>⚽ MatchIA</h1>
  <p>Análisis estadístico de partidos</p>
</header>

<main>

<section id="lista">

<input
  id="buscador"
  class="search"
  type="text"
  placeholder="Buscar equipo o liga..."
  oninput="filtrar()"
>

<button
  class="refresh"
  onclick="cargarPartidos()"
>
  🔄 Actualizar partidos
</button>

<div id="partidos"></div>

</section>

<section
  id="detalle"
  class="hidden"
></section>

</main>

<script>

const partidosDemo = [

  {
    id:"demo-river-boca",
    local:"River Plate",
    visitante:"Boca Juniors",
    liga:"Liga Profesional Argentina",
    pais:"Argentina"
  },

  {
    id:"demo-real-barca",
    local:"Real Madrid",
    visitante:"Barcelona",
    liga:"La Liga",
    pais:"España"
  },

  {
    id:"demo-city-liverpool",
    local:"Manchester City",
    visitante:"Liverpool",
    liga:"Premier League",
    pais:"Inglaterra"
  }

];

let partidos = [...partidosDemo];

let partidoActual = null;

let minuto = 20;

let golesLocal = 0;

let golesVisitante = 0;

let intervalo = null;

/*
  Estos valores son los últimos
  porcentajes mostrados.
*/
let anteriores = null;


/* =========================
   PARTIDOS
========================= */

function cargarPartidos(){

  partidos = [...partidosDemo];

  mostrarPartidos();
}


function mostrarPartidos(){

  const contenedor =
    document.getElementById("partidos");

  const texto =
    document
      .getElementById("buscador")
      .value
      .toLowerCase();

  const filtrados =
    partidos.filter(p =>

      p.local.toLowerCase().includes(texto) ||

      p.visitante.toLowerCase().includes(texto) ||

      p.liga.toLowerCase().includes(texto) ||

      p.pais.toLowerCase().includes(texto)

    );


  if(!filtrados.length){

    contenedor.innerHTML = `
      <div class="empty">
        No se encontraron partidos.
      </div>
    `;

    return;
  }


  contenedor.innerHTML =
    filtrados.map(p => `

      <div class="card">

        <div class="league">
          ${p.liga} · ${p.pais}
        </div>

        <div class="teams">

          <div class="team">
            ${p.local}
          </div>

          <div class="vs">
            VS
          </div>

          <div class="team">
            ${p.visitante}
          </div>

        </div>

        <button
          class="analyze"
          onclick="abrirPartido('${p.id}')"
        >
          🧠 Analizar con MatchIA
        </button>

      </div>

    `).join("");
}


function filtrar(){

  mostrarPartidos();

}


/* =========================
   ABRIR PARTIDO
========================= */

function abrirPartido(id){

  const partido =
    partidos.find(p => p.id === id);

  if(!partido) return;

  partidoActual = partido;

  minuto = 20;

  golesLocal = 0;

  golesVisitante = 0;

  anteriores = null;

  if(intervalo){

    clearInterval(intervalo);

    intervalo = null;

  }

  document
    .getElementById("lista")
    .classList
    .add("hidden");

  document
    .getElementById("detalle")
    .classList
    .remove("hidden");

  renderDetalle();

}


function volver(){

  if(intervalo){

    clearInterval(intervalo);

    intervalo = null;

  }

  document
    .getElementById("detalle")
    .classList
    .add("hidden");

  document
    .getElementById("lista")
    .classList
    .remove("hidden");

}


/* =========================
   NUEVO MODELO DEMO
========================= */

function calcularProbabilidades(){

  /*
    Partimos de una base.

    River 42
    Empate 31
    Boca 27

    El tiempo produce cambios
    visibles en cada minuto.
  */

  let local = 42;

  let empate = 31;

  let visitante = 27;


  /*
    CAMBIO POR TIEMPO

    Cada minuto mueve las
    probabilidades ligeramente.
  */

  const minutosPasados =
    minuto - 20;


  local -= minutosPasados * 0.35;

  empate += minutosPasados * 0.20;

  visitante += minutosPasados * 0.15;


  /*
    CAMBIO POR MARCADOR
  */

  const diferencia =
    golesLocal - golesVisitante;


  if(diferencia > 0){

    local += 20;

    empate -= 8;

    visitante -= 12;

  }


  if(diferencia < 0){

    local -= 12;

    empate -= 8;

    visitante += 20;

  }


  /*
    SI HAY EMPATE DESPUÉS
    DE LOS 60 MINUTOS
  */

  if(
    golesLocal === golesVisitante &&
    minuto >= 60
  ){

    local -= 5;

    empate += 10;

    visitante -= 5;

  }


  /*
    Nunca dejamos valores
    negativos.
  */

  local =
    Math.max(1,local);

  empate =
    Math.max(1,empate);

  visitante =
    Math.max(1,visitante);


  /*
    Normalizamos para que
    siempre sumen 100%.
  */

  const total =
    local +
    empate +
    visitante;


  return {

    local:Math.round(
      local / total * 100
    ),

    empate:Math.round(
      empate / total * 100
    ),

    visitante:Math.round(
      visitante / total * 100
    )

  };

}


/* =========================
   CAMBIO
========================= */

function mostrarCambio(actual, anterior){

  if(anterior === null){

    return `
      <div class="change same">
        ● Inicio
      </div>
    `;

  }


  const diferencia =
    actual - anterior;


  if(diferencia > 0){

    return `
      <div class="change up">
        ↑ +${diferencia}%
      </div>
    `;

  }


  if(diferencia < 0){

    return `
      <div class="change down">
        ↓ ${diferencia}%
      </div>
    `;

  }


  return `
    <div class="change same">
      = 0%
    </div>
  `;

}


/* =========================
   PANTALLA DEL PARTIDO
========================= */

function renderDetalle(){

  const p =
    partidoActual;

  const probs =
    calcularProbabilidades();


  const anteriorLocal =
    anteriores
      ? anteriores.local
      : null;

  const anteriorEmpate =
    anteriores
      ? anteriores.empate
      : null;

  const anteriorVisitante =
    anteriores
      ? anteriores.visitante
      : null;


  document
    .getElementById("detalle")
    .innerHTML = `

    <button
      class="back"
      onclick="volver()"
    >
      ← Volver a partidos
    </button>


    <div class="card">

      <div class="league">
        ${p.liga} · ${p.pais}
      </div>


      <div class="teams">

        <div class="team">
          ${p.local}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">
          ${p.visitante}
        </div>

      </div>


      <div class="score">
        ${golesLocal} - ${golesVisitante}
      </div>


      <div class="live">
        🔴 MINUTO ${minuto}'
      </div>


      <div class="control-grid">

        <button onclick="iniciar()">
          ▶️ Iniciar
        </button>

        <button onclick="avanzar()">
          ⏱️ +1 minuto
        </button>

        <button onclick="golLocal()">
          ⚽ Gol local
        </button>

        <button onclick="golVisitante()">
          ⚽ Gol visitante
        </button>

        <button onclick="reiniciar()">
          ↩️ Reiniciar
        </button>

        <button onclick="agregarCombinada()">
          ➕ Combinada
        </button>

      </div>

    </div>


    <div class="section">

      <h2>
        📊 Probabilidades MatchIA
      </h2>


      <div class="market">

        <div class="percent">

          <span>
            ${p.local}
          </span>

          <span>
            ${probs.local}%
          </span>

        </div>


        ${mostrarCambio(
          probs.local,
          anteriorLocal
        )}


        <div class="bar">

          <div
            class="fill"
            style="width:${probs.local}%"
          ></div>

        </div>

      </div>


      <div class="market">

        <div class="percent">

          <span>
            Empate
          </span>

          <span>
            ${probs.empate}%
          </span>

        </div>


        ${mostrarCambio(
          probs.empate,
          anteriorEmpate
        )}


        <div class="bar">

          <div
            class="fill"
            style="width:${probs.empate}%"
          ></div>

        </div>

      </div>


      <div class="market">

        <div class="percent">

          <span>
            ${p.visitante}
          </span>

          <span>
            ${probs.visitante}%
          </span>

        </div>


        ${mostrarCambio(
          probs.visitante,
          anteriorVisitante
        )}


        <div class="bar">

          <div
            class="fill"
            style="width:${probs.visitante}%"
          ></div>

        </div>

      </div>

    </div>


    <div class="section">

      <h2>
        🧠 ¿Por qué?
      </h2>


      <div class="explanation">

        Las estimaciones se actualizan
        cuando cambia el minuto
        o el marcador.

        <br><br>


        ${
          golesLocal > golesVisitante

          ? `
            ${p.local} está ganando.
            Su probabilidad estimada
            aumenta por la ventaja
            en el marcador.
          `

          : golesVisitante > golesLocal

          ? `
            ${p.visitante} está ganando.
            Su probabilidad estimada
            aumenta por la ventaja
            en el marcador.
          `

          : minuto >= 60

          ? `
            El partido sigue empatado
            y ya está avanzado.
            El modelo aumenta
            ligeramente el peso
            del empate.
          `

          : `
            El partido está equilibrado.
            El paso del tiempo modifica
            gradualmente las estimaciones.
          `
        }

      </div>

    </div>


    <div class="section">

      <h2>
        📈 Estadísticas demo
      </h2>


      <div class="card">

        <div class="market">
          Posesión
          <strong>54% - 46%</strong>
        </div>

        <div class="market">
          Remates
          <strong>8 - 5</strong>
        </div>

        <div class="market">
          Remates al arco
          <strong>4 - 2</strong>
        </div>

        <div class="market">
          Corners
          <strong>5 - 3</strong>
        </div>

        <div class="market">
          Últimos 5
          <strong>3G 1E 1P</strong>
        </div>

      </div>

    </div>


    <div class="section">

      <h2>
        🎯 Mercados
      </h2>

      <div class="market">
        Victoria ${p.local}
      </div>

      <div class="market">
        Empate
      </div>

      <div class="market">
        Victoria ${p.visitante}
      </div>

      <div class="market">
        Más de 1.5 goles
      </div>

      <div class="market">
        Ambos equipos marcan
      </div>

      <div class="market">
        Más de 8.5 corners
      </div>

    </div>


    <div class="section">

      <h2>
        🛡️ Predicción conservadora
      </h2>


      <div class="explanation">

        ${
          golesLocal !== golesVisitante

          ? `
            El marcador actual modifica
            significativamente la estimación.
          `

          : `
            El escenario todavía es equilibrado.
            Estas cifras son estimaciones
            estadísticas y no garantías.
          `
        }

      </div>

    </div>


    <div class="section">

      <h2>
        🤝 Mi combinada
      </h2>


      <div class="combo">

        ${
          combinada.length

          ? combinada
              .map(x => `<div>• ${x}</div>`)
              .join("")

          : "Todavía no agregaste selecciones."
        }

      </div>

    </div>

  `;


  /*
    Guardamos la medición actual
    para compararla con la próxima.
  */

  anteriores = {

    local:probs.local,

    empate:probs.empate,

    visitante:probs.visitante

  };

}


/* =========================
   LIVE
========================= */

function iniciar(){

  if(intervalo) return;


  intervalo =
    setInterval(() => {

      if(minuto >= 90){

        clearInterval(intervalo);

        intervalo = null;

        return;

      }


      minuto++;


      renderDetalle();

    },3000);

}


function avanzar(){

  if(minuto < 90){

    minuto++;

    renderDetalle();

  }

}


function golLocal(){

  golesLocal++;

  renderDetalle();

}


function golVisitante(){

  golesVisitante++;

  renderDetalle();

}


function reiniciar(){

  minuto = 20;

  golesLocal = 0;

  golesVisitante = 0;

  anteriores = null;


  if(intervalo){

    clearInterval(intervalo);

    intervalo = null;

  }


  renderDetalle();

}


/* =========================
   COMBINADA
========================= */

let combinada = [];


function agregarCombinada(){

  const seleccion =
    `${partidoActual.local} vs ${partidoActual.visitante}`;


  if(!combinada.includes(seleccion)){

    combinada.push(seleccion);

  }


  renderDetalle();

}


/* =========================
   INICIO
========================= */

cargarPartidos();

</script>

</body>
</html>
