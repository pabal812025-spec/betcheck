<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchIA</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#07111f;
      color:#fff;
    }

    .app{
      max-width:520px;
      margin:0 auto;
      min-height:100vh;
      background:#0b1728;
      padding-bottom:40px;
    }

    header{
      padding:18px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#0d1b2e;
      border-bottom:1px solid #1d3048;
    }

    .logo{
      font-size:24px;
      font-weight:800;
      color:#35e08b;
    }

    .header-icons{
      display:flex;
      gap:10px;
    }

    .icon-btn{
      width:38px;
      height:38px;
      border:0;
      border-radius:10px;
      background:#16263d;
      color:#fff;
      font-size:18px;
      cursor:pointer;
    }

    .content{
      padding:16px;
    }

    .match-card{
      background:#101f34;
      border:1px solid #203653;
      border-radius:18px;
      padding:16px;
      margin-bottom:16px;
    }

    .match-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
      color:#9db0c8;
      font-size:13px;
    }

    .teams{
      display:grid;
      grid-template-columns:1fr 110px 1fr;
      align-items:center;
      gap:8px;
    }

    .team{
      text-align:center;
    }

    .team-name{
      font-size:17px;
      font-weight:700;
      margin-bottom:8px;
    }

    .score{
      text-align:center;
      font-size:34px;
      font-weight:800;
    }

    .minute{
      text-align:center;
      color:#35e08b;
      font-weight:700;
      font-size:13px;
      margin-top:4px;
    }

    .time-controls{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      margin-top:8px;
    }

    .time-button{
      width:30px;
      height:28px;
      border:0;
      border-radius:7px;
      background:#1a304d;
      color:#fff;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      padding:0;
    }

    .time-button:hover,
    .stat-button:hover{
      background:#244366;
    }

    .time-label{
      min-width:42px;
      text-align:center;
      color:#8fa3bc;
      font-size:10px;
    }

    .probabilities{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .prob{
      background:#0b1728;
      border-radius:12px;
      padding:10px 6px;
      text-align:center;
    }

    .prob-value{
      font-size:22px;
      font-weight:800;
      color:#35e08b;
    }

    .prob-label{
      color:#9db0c8;
      font-size:11px;
      margin-top:4px;
    }

    .stats{
      margin-top:18px;
    }

    .stats-title{
      font-size:14px;
      font-weight:700;
      margin-bottom:10px;
    }

    .stat-row{
      display:grid;
      grid-template-columns:1fr 90px 1fr;
      align-items:center;
      gap:4px;
      margin:9px 0;
    }

    .stat-side{
      display:flex;
      align-items:center;
      gap:5px;
    }

    .stat-side.right{
      justify-content:flex-end;
    }

    .stat-value{
      min-width:20px;
      text-align:center;
      font-weight:700;
    }

    .stat-name{
      text-align:center;
      color:#8fa3bc;
      font-size:11px;
    }

    .stat-button{
      width:28px;
      height:28px;
      border:0;
      border-radius:7px;
      background:#1a304d;
      color:#fff;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      padding:0;
    }

    .analysis{
      margin-top:18px;
      background:#0b1728;
      border-radius:12px;
      padding:13px;
      color:#c5d2e2;
      line-height:1.45;
      font-size:13px;
    }

    .analysis strong{
      color:#fff;
    }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }
  </style>
</head>

<body>

            <button

<script>

  /*
   * ESTADO INICIAL
   * TODO ARRANCA EN CERO
   */

  const match = {

    minute: 0,

    homeGoals: 0,
    awayGoals: 0,

    homeArrivals: 0,
    awayArrivals: 0,

    homeShots: 0,
    awayShots: 0,

    homeOnTarget: 0,
    awayOnTarget: 0,

    homeCorners: 0,
    awayCorners: 0,

    homeReds: 0,
    awayReds: 0

  };


  function clamp(value,min,max){

    return Math.max(
      min,
      Math.min(max,value)
    );

  }


  /*
   * MINUTO
   */

  function changeMinute(amount){

    match.minute =
      clamp(
        match.minute + amount,
        0,
        90
      );

    render();

  }


  /*
   * MOTOR DE PORCENTAJES
   * SE MANTIENE LA CALIBRACIÓN
   */

  function calculateProbabilities(){

    const minute = clamp(
      Number(match.minute) || 0,
      0,
      90
    );


    const hg = Number(match.homeGoals) || 0;
    const ag = Number(match.awayGoals) || 0;

    const ha = Number(match.homeArrivals) || 0;
    const aa = Number(match.awayArrivals) || 0;

    const hs = Number(match.homeShots) || 0;
    const as = Number(match.awayShots) || 0;

    const hot = Number(match.homeOnTarget) || 0;
    const aot = Number(match.awayOnTarget) || 0;

    const hc = Number(match.homeCorners) || 0;
    const ac = Number(match.awayCorners) || 0;

    const homeReds = Number(match.homeReds) || 0;
    const awayReds = Number(match.awayReds) || 0;


    let home = 33;
    let draw = 34;
    let away = 33;


    const arrivalDiff = ha - aa;

    home += arrivalDiff * 0.55;
    away -= arrivalDiff * 0.55;


    const shotDiff = hs - as;

    home += shotDiff * 0.30;
    away -= shotDiff * 0.30;


    const targetDiff = hot - aot;

    home += targetDiff * 1.15;
    away -= targetDiff * 1.15;


    const cornerDiff = hc - ac;

    home += cornerDiff * 0.20;
    away -= cornerDiff * 0.20;


    const goalDiff = hg - ag;

    let goalWeight = 4.5;


    if(minute <= 15){

      goalWeight = 4.5;

    }

    else if(minute <= 30){

      goalWeight = 6.0;

    }

    else if(minute <= 45){

      goalWeight = 7.5;

    }

    else if(minute <= 60){

      goalWeight = 9.0;

    }

    else if(minute <= 75){

      goalWeight = 12.0;

    }

    else if(minute <= 85){

      goalWeight = 16.0;

    }

    else{

      goalWeight = 22.0;

    }


    home += goalDiff * goalWeight;
    away -= goalDiff * goalWeight;

    draw -=
      Math.abs(goalDiff) *
      (goalWeight * 0.35);


    if(goalDiff === 0){

      const timeWeight =
        Math.min(minute,90) / 90;

      draw += timeWeight * 8;

      home -= timeWeight * 4;
      away -= timeWeight * 4;

    }


    const redDifference =
      awayReds - homeReds;

    home += redDifference * 7;
    away -= redDifference * 7;


    if(homeReds > 0){

      away += homeReds * 2;
      home -= homeReds * 2;

    }


    if(awayReds > 0){

      home += awayReds * 2;
      away -= awayReds * 2;

    }


    if(minute >= 85){

      let lateTarget =
        90 +
        7.5 *
        Math.pow(
          (Math.min(minute,90) - 85) / 5,
          1.15
        );


      lateTarget =
        clamp(
          lateTarget,
          90,
          97.5
        );


      const remaining =
        100 - lateTarget;


      if(hg === ag){

        const positiveHome =
          Math.max(home,0);

        const positiveAway =
          Math.max(away,0);

        const nonDraw =
          positiveHome + positiveAway;


        if(nonDraw > 0){

          home =
            (positiveHome / nonDraw) *
            remaining;

          away =
            (positiveAway / nonDraw) *
            remaining;

        }

        else{

          home =
            remaining / 2;

          away =
            remaining / 2;

        }


        draw =
          lateTarget;

      }


      else if(hg > ag){

        const goalLead =
          hg - ag;


        if(
          minute >= 89 &&
          goalLead >= 4
        ){

          home = 100;
          draw = 0;
          away = 0;

        }

        else if(
          minute >= 89 &&
          goalLead === 3
        ){

          home = 99.6;
          draw = 0.25;
          away = 0.15;

        }

        else if(
          minute >= 89 &&
          goalLead === 2
        ){

          home = 99.0;
          draw = 0.7;
          away = 0.3;

        }

        else{

          const positiveDraw =
            Math.max(draw,0);

          const positiveAway =
            Math.max(away,0);

          const nonHome =
            positiveDraw + positiveAway;


          home =
            lateTarget;


          if(nonHome > 0){

            draw =
              (positiveDraw / nonHome) *
              remaining;

            away =
              (positiveAway / nonHome) *
              remaining;

          }

          else{

            draw =
              remaining * 0.75;

            away =
              remaining * 0.25;

          }

        }

      }


      else{

        const goalLead =
          ag - hg;


        if(
          minute >= 89 &&
          goalLead >= 4
        ){

          away = 100;
          draw = 0;
          home = 0;

        }

        else if(
          minute >= 89 &&
          goalLead === 3
        ){

          away = 99.6;
          draw = 0.25;
          home = 0.15;

        }

        else if(
          minute >= 89 &&
          goalLead === 2
        ){

          away = 99.0;
          draw = 0.7;
          home = 0.3;

        }

        else{

          const positiveHome =
            Math.max(home,0);

          const positiveDraw =
            Math.max(draw,0);

          const nonAway =
            positiveHome + positiveDraw;


          away =
            lateTarget;


          if(nonAway > 0){

            home =
              (positiveHome / nonAway) *
              remaining;

            draw =
              (positiveDraw / nonAway) *
              remaining;

          }

          else{

            home =
              remaining * 0.25;

            draw =
              remaining * 0.75;

          }

        }

      }

    }


    if(minute < 85){

      const minimumProbability =
        minute < 75 ? 8 : 3;


      home =
        clamp(
          home,
          minimumProbability,
          94
        );


      draw =
        clamp(
          draw,
          minimumProbability,
          94
        );


      away =
        clamp(
          away,
          minimumProbability,
          94
        );

    }


    home =
      Math.max(home,0);

    draw =
      Math.max(draw,0);

    away =
      Math.max(away,0);


    const total =
      home + draw + away;


    if(
      !Number.isFinite(total) ||
      total <= 0
    ){

      return {
        home:33,
        draw:34,
        away:33
      };

    }


    return {

      home:
        home / total * 100,

      draw:
        draw / total * 100,

      away:
        away / total * 100

    };

  }


  /*
   * ESTADÍSTICAS
   */

  function changeStat(team,stat,amount){

    const prefix =
      team === 'home'
        ? 'home'
        : 'away';


    /*
     * LLEGADA
     */

    if(stat === 'arrival'){

      match[prefix + 'Arrivals'] =
        Math.max(
          0,
          match[prefix + 'Arrivals'] + amount
        );

    }


    /*
     * TIRO
     *
     * Tiro = tiro + llegada
     */

    else if(stat === 'shot'){

      if(amount > 0){

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      }

      else if(match[prefix + 'Shots'] > 0){

        match[prefix + 'Shots'] -= 1;

        match[prefix + 'Arrivals'] =
          Math.max(
            0,
            match[prefix + 'Arrivals'] - 1
          );

      }

    }


    /*
     * AL ARCO
     *
     * Al arco = al arco + tiro + llegada
     */

    else if(stat === 'target'){

      if(amount > 0){

        match[prefix + 'OnTarget'] += 1;

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      }

      else if(match[prefix + 'OnTarget'] > 0){

        match[prefix + 'OnTarget'] -= 1;

        match[prefix + 'Shots'] =
          Math.max(
            0,
            match[prefix + 'Shots'] - 1
          );

        match[prefix + 'Arrivals'] =
          Math.max(
            0,
            match[prefix + 'Arrivals'] - 1
          );

      }

    }


    /*
     * GOL
     *
     * Gol = gol + al arco + tiro + llegada
     */

    else if(stat === 'goal'){

      if(amount > 0){

        match[prefix + 'Goals'] += 1;

        match[prefix + 'OnTarget'] += 1;

        match[prefix + 'Shots'] += 1;

        match[prefix + 'Arrivals'] += 1;

      }

      else if(match[prefix + 'Goals'] > 0){

        match[prefix + 'Goals'] -= 1;

        match[prefix + 'OnTarget'] =
          Math.max(
            0,
            match[prefix + 'OnTarget'] - 1
          );

        match[prefix + 'Shots'] =
          Math.max(
            0,
            match[prefix + 'Shots'] - 1
          );

        match[prefix + 'Arrivals'] =
          Math.max(
            0,
            match[prefix + 'Arrivals'] - 1
          );

      }

    }


    /*
     * CÓRNER
     */

    else if(stat === 'corner'){

      match[prefix + 'Corners'] =
        Math.max(
          0,
          match[prefix + 'Corners'] + amount
        );

    }


    /*
     * ROJA
     */

    else if(stat === 'red'){

      match[prefix + 'Reds'] =
        Math.max(
          0,
          match[prefix + 'Reds'] + amount
        );

    }


    render();

  }


  function render(){

    document.getElementById('homeGoals').textContent =
      match.homeGoals;

    document.getElementById('awayGoals').textContent =
      match.awayGoals;


    document.getElementById('homeGoalsStat').textContent =
      match.homeGoals;

    document.getElementById('awayGoalsStat').textContent =
      match.awayGoals;


    document.getElementById('minute').textContent =
      match.minute;


    document.getElementById('homeArrivals').textContent =
      match.homeArrivals;

    document.getElementById('awayArrivals').textContent =
      match.awayArrivals;


    document.getElementById('homeShots').textContent =
      match.homeShots;

    document.getElementById('awayShots').textContent =
      match.awayShots;


    document.getElementById('homeOnTarget').textContent =
      match.homeOnTarget;

    document.getElementById('awayOnTarget').textContent =
      match.awayOnTarget;


    document.getElementById('homeCorners').textContent =
      match.homeCorners;

    document.getElementById('awayCorners').textContent =
      match.awayCorners;


    document.getElementById('homeReds').textContent =
      match.homeReds;

    document.getElementById('awayReds').textContent =
      match.awayReds;


    const probabilities =
      calculateProbabilities();


    document.getElementById('homeProb').textContent =
      Math.round(probabilities.home) + '%';

    document.getElementById('drawProb').textContent =
      Math.round(probabilities.draw) + '%';

    document.getElementById('awayProb').textContent =
      Math.round(probabilities.away) + '%';


    updateAnalysis();

  }


  function updateAnalysis(){

    const minute =
      match.minute;

    const hg =
      match.homeGoals;

    const ag =
      match.awayGoals;


    let text =
      minute +
      "' · " +
      hg +
      "-" +
      ag +
      ". ";


    if(hg === ag){

      text +=
        "El marcador está igualado y todavía puede producirse un cambio en el resultado.";

    }

    else if(hg > ag){

      const difference =
        hg - ag;


      if(
        minute >= 89 &&
        difference >= 4
      ){

        text +=
          "Queda muy poco tiempo y la diferencia de goles hace que el resultado esté prácticamente cerrado.";

      }

      else if(
        minute >= 89 &&
        difference >= 2
      ){

        text +=
          "Queda muy poco tiempo y la diferencia de goles concentra casi toda la probabilidad en River.";

      }

      else{

        text +=
          "River está por delante en el marcador y el tiempo restante aumenta el peso del resultado actual.";

      }

    }

    else{

      const difference =
        ag - hg;


      if(
        minute >= 89 &&
        difference >= 4
      ){

        text +=
          "Queda muy poco tiempo y la diferencia de goles hace que el resultado esté prácticamente cerrado.";

      }

      else if(
        minute >= 89 &&
        difference >= 2
      ){

        text +=
          "Queda muy poco tiempo y la diferencia de goles concentra casi toda la probabilidad en Boca.";

      }

      else{

        text +=
          "Boca está por delante en el marcador y el tiempo restante aumenta el peso del resultado actual.";

      }

    }


    document.getElementById('analysisText').textContent =
      text;

  }


  function showMessage(message){

    alert(message);

  }


  /*
   * INICIO
   */

  render();

</script>
