<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIA</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
}

.card{
  background:#151c32;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.score{
  display:flex;
  justify-content:space-around;
  align-items:center;
  text-align:center;
}

.team{
  width:35%;
}

.team-name{
  font-size:20px;
  font-weight:bold;
}

.goals{
  font-size:42px;
  font-weight:bold;
  margin-top:10px;
}

.minute{
  font-size:18px;
  color:#aaa;
}

.probs{
  display:flex;
  justify-content:space-around;
  text-align:center;
}

.prob{
  font-size:28px;
  font-weight:bold;
}

.label{
  color:#aaa;
  margin-top:5px;
}

.explanation{
  background:#10172a;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  text-align:center;
}

.stat{
  background:#10172a;
  padding:10px;
  border-radius:10px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px;
  background:#26345c;
  color:white;
  font-size:15px;
}

.reset{
  width:100%;
  margin-top:10px;
  background:#8b2635;
}

.start{
  width:100%;
  margin-bottom:10px;
  background:#16734a;
}
</style>
</head>

</div>

</div>

<div class="team">

<div class="explanation">

<div id="explanation" style="margin-top:8px;"></div>
</div>

</div>


<div class="card">

<div class="stats">

<div class="stat">
Posesión<br>51% - 49%
</div>

<div class="stat">
Tiros<br>
<span id="homeShots">0</span> -
<span id="awayShots">0</span>
</div>

<div class="stat">

</div>

<div class="stat">

</div>

</div>

<p style="text-align:center">

</p>

</div>


<div class="card">

<button class="start" onclick="startMatch()">

</button>

<div class="buttons">

<button onclick="goalHome()">⚽ Gol River</button>

<button onclick="redAway()">🟥 Roja Boca</button>

<button onclick="addHomeTarget()">🎯 Al arco River</button>

<button onclick="addAwayTarget()">🎯 Al arco Boca</button>

</div>

<button class="reset" onclick="resetMatch()">
🔄 Reiniciar
</button>

</div>

</div>
