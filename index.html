<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatchIA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:#0d1b2f;
  padding:18px 16px;
  text-align:center;
  border-bottom:1px solid #203452;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:6px 0 0;
  color:#8fa6c5;
  font-size:13px;
}

main{
  max-width:700px;
  margin:auto;
  padding:16px;
}

.search{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #29415f;
  background:#0d1b2f;
  color:white;
  font-size:16px;
  margin-bottom:14px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{
  width:100%;
  background:#173456;
  color:white;
  margin-bottom:15px;
}

.card{
  background:#0d1b2f;
  border:1px solid #223b5d;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.league{
  color:#7fa8d8;
  font-size:12px;
  margin-bottom:12px;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.team{
  width:42%;
  text-align:center;
  font-weight:bold;
}

.vs{
  color:#7f93ad;
  font-size:13px;
}

.analyze{
  width:100%;
  margin-top:15px;
  background:#16a765;
  color:white;
  font-size:15px;
}

.hidden{
  display:none;
}

.back{
  background:#243c5b;
  color:white;
  margin-bottom:15px;
}

.score{
  text-align:center;
  font-size:42px;
  font-weight:bold;
  margin:12px 0;
}

.live{
  text-align:center;
  color:#ffcc55;
  font-weight:bold;
}

.control-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.control-grid button{
  background:#1b3351;
  color:white;
}

.section{
  margin-top:16px;
}

.section h2{
  font-size:18px;
  margin-bottom:10px;
}

.market{
  margin:9px 0;
  padding:12px;
  background:#122641;
  border-radius:10px;
}

.percent{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.change{
  font-size:13px;
  margin-top:5px;
}

.up{
  color:#36d98b;
}

.down{
  color:#ff6b6b;
}

.same{
  color:#8fa6c5;
}

.bar{
  height:9px;
  background:#203a59;
  border-radius:10px;
  overflow:hidden;
  margin-top:7px;
}

.fill{
  height:100%;
  background:#16a765;
  transition:width .3s ease;
}

.explanation{
  background:#102a42;
  padding:14px;
  border-radius:12px;
  color:#d7e6f7;
  line-height:1.5;
}

.combo{
  background:#102b20;
  border:1px solid #246a46;
  padding:14px;
  border-radius:12px;
}

.small{
  color:#8fa6c5;
  font-size:13px;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#8fa6c5;
}

.history{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.history div{
  background:#122641;
  border-radius:10px;
  padding:12px 5px;
  text-align:center;
}

.number{
  font-size:22px;
  font-weight:bold;
  display:block;
  margin-top:4px;
}
</style>
</head>

<body>

<header>
  <h1>⚽ MatchIA</h1>
  <p>Análisis estadístico de partidos</p>
</header>

<main>

<section id="lista">

  <input
    id="buscador"
    class="search"
    type="text"
    placeholder="Buscar equipo o liga..."
    oninput="filtrar()"
  >

  <button class="refresh" onclick="cargarPartidos()">
    🔄 Actualizar partidos
  </button>

  <div id="partidos"></div>

</section>

<section id="detalle" class="hidden"></section>

</main>

<script>

const partidosDemo = [
  {
    id:"demo-river-boca",
    local:"River Plate",
    visitante:"Boca Juniors",
    liga:"Liga Profesional Argentina",
    pais:"Argentina"
  },
  {
    id:"demo-real-barca",
    local:"Real Madrid",
    visitante:"Barcelona",
    liga:"La Liga",
    pais:"España"
  },
  {
    id:"demo-city-liverpool",
    local:"Manchester City",
    visitante:"Liverpool",
    liga:"Premier League",
    pais:"Inglaterra"
  }
];

let partidos = [...partidosDemo];

let partidoActual = null;

let minuto = 20;
let golesLocal = 0;
let golesVisitante = 0;

let intervalo = null;

let combinada = [];

/*
  Guardamos la medición anterior.
  Esto permite mostrar:
  ↑ +8%
  ↓ -5%
  = 0%
*/
let porcentajesAnteriores = null;

function cargarPartidos(){

  partidos = [...partidosDemo];

  mostrarPartidos();
}

function mostrarPartidos(){

  const contenedor = document.getElementById("partidos");

  const texto =
    document.getElementById("buscador").value.toLowerCase();

  const filtrados = partidos.filter(p =>
    p.local.toLowerCase().includes(texto) ||
    p.visitante.toLowerCase().includes(texto) ||
    p.liga.toLowerCase().includes(texto) ||
    p.pais.toLowerCase().includes(texto)
  );

  if(!filtrados.length){

    contenedor.innerHTML = `
      <div class="empty">
        No se encontraron partidos.
      </div>
    `;

    return;
  }

  contenedor.innerHTML = filtrados.map(p => `

    <div class="card">

      <div class="league">
        ${p.liga} · ${p.pais}
      </div>

      <div class="teams">

        <div class="team">
          ${p.local}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">
          ${p.visitante}
        </div>

      </div>

      <button
        class="analyze"
        onclick="abrirPartido('${p.id}')"
      >
        🧠 Analizar con MatchIA
      </button>

    </div>

  `).join("");
}

function filtrar(){
  mostrarPartidos();
}

function abrirPartido(id){

  const partido = partidos.find(p => p.id === id);

  if(!partido) return;

  partidoActual = partido;

  minuto = 20;
  golesLocal = 0;
  golesVisitante = 0;

  porcentajesAnteriores = null;

  if(intervalo){

    clearInterval(intervalo);

    intervalo = null;
  }

  document.getElementById("lista")
    .classList.add("hidden");

  document.getElementById("detalle")
    .classList.remove("hidden");

  renderDetalle();
}

function volver(){

  if(intervalo){

    clearInterval(intervalo);

    intervalo = null;
  }

  document.getElementById("detalle")
    .classList.add("hidden");

  document.getElementById("lista")
    .classList.remove("hidden");
}

function probabilidades(){

  let local = 42;
  let empate = 31;
  let visitante = 27;

  /*
    A medida que avanza el partido,
    la distribución cambia.
  */

  const factorTiempo = (minuto - 20) * 0.08;

  local -= factorTiempo;

  visitante += factorTiempo;

  empate += factorTiempo * 0.5;

  /*
    Si hay gol local.
  */

  if(golesLocal > golesVisitante){

    local += 25;

    empate -= 12;

    visitante -= 13;
  }

  /*
    Si hay gol visitante.
  */

  if(golesVisitante > golesLocal){

    visitante += 25;

    empate -= 12;

    local -= 13;
  }

  /*
    Si siguen empatados después
    de los 60 minutos.
  */

  if(
    golesLocal === golesVisitante &&
    minuto > 60
  ){

    empate += 8;

    local -= 4;

    visitante -= 4;
  }

  local = Math.max(1,local);

  empate = Math.max(1,empate);

  visitante = Math.max(1,visitante);

  const total =
    local + empate + visitante;

  return {

    local:Math.round(
      local / total * 100
    ),

    empate:Math.round(
      empate / total * 100
    ),

    visitante:Math.round(
      visitante / total * 100
    )

  };
}

function mostrarCambio(actual, anterior){

  if(anterior === null){

    return `
      <div class="change same">
        ● Inicio del análisis
      </div>
    `;
  }

  const diferencia =
    actual - anterior;

  if(diferencia > 0){

    return `
      <div class="change up">
        ↑ +${diferencia}%
      </div>
    `;
  }

  if(diferencia < 0){

    return `
      <div class="change down">
        ↓ ${diferencia}%
      </div>
    `;
  }

  return `
    <div class="change same">
      = 0%
    </div>
  `;
}

function renderDetalle(){

  const p = partidoActual;

  const probs = probabilidades();

  const anteriores =
    porcentajesAnteriores;

  document.getElementById("detalle").innerHTML = `

    <button
      class="back"
      onclick="volver()"
    >
      ← Volver a partidos
    </button>

    <div class="card">

      <div class="league">
        ${p.liga} · ${p.pais}
      </div>

      <div class="teams">

        <div class="team">
          ${p.local}
        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">
          ${p.visitante}
        </div>

      </div>

      <div class="score">
        ${golesLocal} - ${golesVisitante}
      </div>

      <div class="live">
        🔴 MINUTO ${minuto}'
      </div>

      <div class="control-grid">

        <button onclick="iniciar()">
          ▶️ Iniciar
        </button>

        <button onclick="avanzar()">
          ⏱️ +1 minuto
        </button>

        <button onclick="golLocal()">
          ⚽ Gol local
        </button>

        <button onclick="golVisitante()">
          ⚽ Gol visitante
        </button>

        <button onclick="reiniciar()">
          ↩️ Reiniciar
        </button>

        <button onclick="agregarCombinada()">
          ➕ Combinada
        </button>

      </div>

    </div>

    <div class="section">

      <h2>
        📊 Probabilidades MatchIA
      </h2>

      <div class="market">

        <div class="percent">

          <span>
            ${p.local}
          </span>

          <span>
            ${probs.local}%
          </span>

        </div>

        ${
          mostrarCambio(
            probs.local,
            anteriores?.local ?? null
          )
        }

        <div class="bar">

          <div
            class="fill"
            style="width:${probs.local}%"
          ></div>

        </div>

      </div>

      <div class="market">

        <div class="percent">

          <span>
            Empate
          </span>

          <span>
            ${probs.empate}%
          </span>

        </div>

        ${
          mostrarCambio(
            probs.empate,
            anteriores?.empate ?? null
          )
        }

        <div class="bar">

          <div
            class="fill"
            style="width:${probs.empate}%"
          ></div>

        </div>

      </div>

      <div class="market">

        <div class="percent">

          <span>
            ${p.visitante}
          </span>

          <span>
            ${probs.visitante}%
          </span>

        </div>

        ${
          mostrarCambio(
            probs.visitante,
            anteriores?.visitante ?? null
          )
        }

        <div class="bar">

          <div
            class="fill"
            style="width:${probs.visitante}%"
          ></div>

        </div>

      </div>

    </div>

    <div class="section">

      <h2>
        🧠 ¿Por qué?
      </h2>

      <div class="explanation">

        Las estimaciones se actualizan
        cuando cambia el minuto o el marcador.

        <br><br>

        ${
          golesLocal > golesVisitante

          ? `El gol de ${p.local}
             aumenta su probabilidad
             estimada y reduce las
             alternativas.`

          : golesVisitante > golesLocal

          ? `El gol de ${p.visitante}
             aumenta su probabilidad
             estimada y modifica
             el equilibrio del partido.`

          : minuto > 60

          ? `Con el partido avanzado
             y empatado, aumenta
             el peso estadístico
             del empate.`

          : `El partido está equilibrado.
             A medida que avancen
             los minutos, las
             estimaciones cambiarán.`
        }

      </div>

    </div>

    <div class="section">

      <h2>
        📈 Estadísticas demo
      </h2>

      <div class="card">

        <div class="stat">
          <span>Posesión</span>
          <span>54% - 46%</span>
        </div>

        <div class="stat">
          <span>Remates</span>
          <span>8 - 5</span>
        </div>

        <div class="stat">
          <span>Remates al arco</span>
          <span>4 - 2</span>
        </div>

        <div class="stat">
          <span>Corners</span>
          <span>5 - 3</span>
        </div>

        <div class="stat">
          <span>Últimos 5</span>
          <span>3G 1E 1P</span>
        </div>

      </div>

    </div>

    <div class="section">

      <h2>
        🎯 Mercados
      </h2>

      <div class="market">
        Victoria ${p.local}
      </div>

      <div class="market">
        Empate
      </div>

      <div class="market">
        Victoria ${p.visitante}
      </div>

      <div class="market">
        Más de 1.5 goles
      </div>

      <div class="market">
        Ambos equipos marcan
      </div>

      <div class="market">
        Más de 8.5 corners
      </div>

    </div>

    <div class="section">

      <h2>
        🛡️ Predicción conservadora
      </h2>

      <div class="explanation">

        ${
          golesLocal !== golesVisitante

          ? "El marcador actual modifica significativamente la estimación."

          : "El escenario todavía es equilibrado. Las probabilidades son estimaciones estadísticas y no garantías."
        }

      </div>

    </div>

    <div class="section">

      <h2>
        🤝 Mi combinada
      </h2>

      <div class="combo">

        ${
          combinada.length

          ? combinada
              .map(x => `<div>• ${x}</div>`)
              .join("")

          : "Todavía no agregaste selecciones."
        }

      </div>

    </div>

  `;

  /*
    Después de dibujar la pantalla,
    guardamos estos porcentajes como
    referencia para el próximo cambio.
  */

  porcentajesAnteriores = {
    local:probs.local,
    empate:probs.empate,
    visitante:probs.visitante
  };
}

function iniciar(){

  if(intervalo) return;

  intervalo = setInterval(() => {

    if(minuto >= 90){

      clearInterval(intervalo);

      intervalo = null;

      return;
    }

    minuto++;

    renderDetalle();

  },3000);
}

function avanzar(){

  if(minuto < 90){

    minuto++;

    renderDetalle();
  }
}

function golLocal(){

  golesLocal++;

  renderDetalle();
}

function golVisitante(){

  golesVisitante++;

  renderDetalle();
}

function reiniciar(){

  minuto = 20;

  golesLocal = 0;

  golesVisitante = 0;

  porcentajesAnteriores = null;

  if(intervalo){

    clearInterval(intervalo);

    intervalo = null;
  }

  renderDetalle();
}

function agregarCombinada(){

  const seleccion =
    `${partidoActual.local} vs ${partidoActual.visitante}`;

  if(!combinada.includes(seleccion)){

    combinada.push(seleccion);
  }

  renderDetalle();
}

cargarPartidos();

</script>

</body>
</html>
